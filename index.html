<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Geo Explorer v0.2</title>
<style>
:root{--ink:#203047;--muted:#6e7b8e;--blue:#4c8dff;--blue2:#2f6fdd;--green:#34b66e;--red:#e75b5b;--shadow:0 18px 40px rgba(40,72,110,.16)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink)}body{background:linear-gradient(160deg,#eaf5ff,#f8fbff);min-height:100vh}.app{max-width:980px;margin:auto;padding:20px}.screen{display:none}.screen.active{display:block}.panel{background:#fffffff2;border-radius:28px;padding:28px;box-shadow:var(--shadow)}.center{text-align:center}.kicker{font-size:13px;letter-spacing:.18em;font-weight:900;color:var(--blue2)}.logo{font-size:clamp(36px,7vw,64px);font-weight:1000;margin:14px 0 8px}.subtitle{color:var(--muted);font-size:18px;font-weight:800}.stage{display:inline-flex;margin-top:24px;padding:10px 16px;border-radius:999px;background:#eef5ff;color:var(--blue2);font-weight:900}.primary{border:0;border-radius:18px;padding:16px 26px;background:linear-gradient(180deg,var(--blue),var(--blue2));color:white;font-weight:1000;font-size:20px;box-shadow:0 10px 24px rgba(47,111,221,.28)}.start{margin-top:28px}.note{margin-top:18px;color:var(--muted);font-size:14px;font-weight:700}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{font-weight:1000;font-size:20px}.progress{display:flex;align-items:center;gap:10px;flex:1;max-width:430px}.track{height:12px;background:#dce9f8;border-radius:999px;overflow:hidden;flex:1}.bar{height:100%;width:0;background:linear-gradient(90deg,#6fb2ff,#4c8dff);transition:.35s}.plabel{font-size:13px;font-weight:900;color:var(--muted)}.question{font-size:clamp(22px,4vw,34px);font-weight:1000;text-align:center;margin:4px 0 6px}.hint{text-align:center;color:var(--muted);font-weight:800;margin-bottom:16px}.map-area{position:relative;background:linear-gradient(180deg,#dff4ff,#eef9ff);border-radius:24px;min-height:440px;overflow:hidden;border:3px solid #d6ebfb}.map-area:before{content:"北海道";position:absolute;left:18px;top:14px;font-weight:1000;color:#5f7793;z-index:2}#map{position:absolute;inset:20px;width:calc(100% - 40px);height:calc(100% - 40px)}.shape{fill:#f5ead6;stroke:#9d7e5a;stroke-width:4;filter:drop-shadow(0 10px 12px rgba(60,70,80,.14))}.detail{fill:none;stroke:#d0b692;stroke-width:2;stroke-dasharray:5 5;opacity:.6}.target{position:absolute;transform:translate(-50%,-50%);width:112px;height:74px;border:4px dashed var(--blue);border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--blue2);font-size:13px;font-weight:1000;background:#ffffffd6;box-shadow:0 8px 18px rgba(47,111,221,.14);z-index:4;transition:.15s}.target .num{display:block;font-size:22px}.target.over{transform:translate(-50%,-50%) scale(1.08);background:#fff6cf}.target.correct{background:#e8fff0;border-style:solid;border-color:var(--green);color:#207d4c}.target.wrong{animation:shake .35s;background:#fff0f0;border-color:var(--red);color:#a73535}.choices-title{text-align:center;font-size:15px;color:var(--muted);font-weight:900;margin:16px 0 8px}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.choice{min-height:88px;border:3px solid transparent;border-radius:20px;background:linear-gradient(180deg,#fff,#edf4ff);box-shadow:0 10px 22px rgba(35,62,90,.11);padding:14px 10px;font-size:18px;font-weight:1000;display:flex;align-items:center;justify-content:center;text-align:center;cursor:grab;user-select:none;touch-action:none}.choice.dragging{opacity:.22}.choice.correct{border-color:var(--green);background:#eafff1;color:#217b4b;opacity:.55}.choice.wrong{border-color:var(--red);background:#fff0f0;color:#a73535}.choice.locked{pointer-events:none}.ghost{position:fixed;z-index:9999;pointer-events:none;min-width:150px;padding:16px 18px;border-radius:18px;background:white;border:3px solid var(--blue);box-shadow:0 18px 40px rgba(35,62,90,.25);font-weight:1000;text-align:center;transform:translate(-50%,-50%) rotate(-2deg)}.feedback{min-height:48px;margin-top:14px;display:flex;align-items:center;justify-content:center;font-weight:1000;font-size:18px;text-align:center;color:var(--muted)}.good{color:var(--green)}.bad{color:var(--red)}.next-row{text-align:center;margin-top:8px}.next{display:none}.next.show{display:inline-block}.bigmark{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:10000}.bigmark.show{display:flex;animation:fade .72s forwards}.bigmark span{font-size:min(46vw,300px);font-weight:1000;color:var(--green)}.clear-icon{font-size:84px}.clear-title{font-size:clamp(34px,7vw,62px);font-weight:1000;margin:8px 0}.clear-sub{color:var(--muted);font-size:18px;font-weight:800}.stars{font-size:46px;margin:18px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.item{background:#f2f7fd;border-radius:18px;padding:14px;font-weight:900}.item strong{display:block;font-size:26px;color:var(--blue2)}.secondary{border:2px solid #cfdced;border-radius:16px;padding:14px 20px;background:white;color:var(--ink);font-weight:1000}@keyframes shake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(-50%,-50%) translateX(-7px)}50%{transform:translate(-50%,-50%) translateX(7px)}}@keyframes fade{0%{opacity:0;transform:scale(.55)}35%{opacity:1;transform:scale(1.08)}100%{opacity:0}}@media(max-width:700px){.app{padding:12px}.panel{padding:18px;border-radius:22px}.topbar{align-items:flex-start;flex-direction:column}.progress{width:100%;max-width:none}.map-area{min-height:390px}.target{width:98px;height:68px}.choices{gap:8px}.choice{font-size:15px;min-height:82px}}@media(max-width:430px){.map-area{min-height:360px}.target{width:88px;height:64px;font-size:12px}.choices{grid-template-columns:1fr}.choice{min-height:62px}}
</style></head><body><div class="app">
<section id="home" class="screen active"><div class="panel center"><div class="kicker">PROJECT AIノオト #002</div><div class="logo">Geo Explorer</div><div class="subtitle">日本発見！ 地図をめぐる冒険へ</div><div class="stage">🧭 Stage 1　北海道・山地編</div><br><button id="start" class="primary start">冒険をはじめる</button><div class="note">3つのカードを、3つの正しい場所へ運ぼう</div></div></section>
<section id="game" class="screen"><div class="topbar"><div class="brand">Geo Explorer v0.2</div><div class="progress"><div class="track"><div id="bar" class="bar"></div></div><div id="plabel" class="plabel">0 / 3</div></div></div><div class="panel"><div class="question">北海道の3つの山地を配置しよう！</div><div class="hint">カードを正しい番号へドラッグ。置く順番は自由です。</div><div class="map-area"><svg id="map" viewBox="0 0 760 430"><path class="shape" d="M128,205 C145,170 175,142 214,127 C248,114 279,92 302,64 C320,42 348,50 365,75 C382,102 406,117 439,115 C477,113 506,83 533,48 C548,29 567,28 581,44 C596,61 597,84 593,106 C587,139 604,163 639,177 C674,191 695,217 699,245 C703,272 685,286 657,281 C625,276 598,284 574,307 C548,331 527,356 496,362 C464,368 435,350 409,343 C377,334 353,344 323,365 C290,388 252,391 221,375 C193,360 180,333 175,304 C170,276 155,253 131,240 C111,229 112,222 128,205 Z"/><path class="detail" d="M240,132 C280,168 295,204 301,255"/><path class="detail" d="M430,130 C406,174 402,216 410,258"/><path class="detail" d="M560,120 C538,156 531,191 536,223"/></svg><div class="target" data-answer="北見山地" style="left:62%;top:34%"><div><span class="num">①</span>ここへ</div></div><div class="target" data-answer="石狩山地" style="left:45%;top:45%"><div><span class="num">②</span>ここへ</div></div><div class="target" data-answer="日高山脈" style="left:55%;top:64%"><div><span class="num">③</span>ここへ</div></div></div><div class="choices-title">山地カード</div><div id="choices" class="choices"><div class="choice" data-value="日高山脈">日高山脈</div><div class="choice" data-value="北見山地">北見山地</div><div class="choice" data-value="石狩山地">石狩山地</div></div><div id="feedback" class="feedback">好きなカードから始めよう</div><div class="next-row"><button id="finish" class="primary next">北海道をクリア！</button></div></div></section>
<section id="clear" class="screen"><div class="panel center"><div class="clear-icon">🗺️✨</div><div class="clear-title">北海道クリア！</div><div class="clear-sub">3つの山地を、すべて配置できました。</div><div class="stars">★★★</div><div class="summary"><div class="item"><strong>3</strong>配置</div><div class="item"><strong id="missCount">0</strong>ミス</div><div class="item"><strong>1</strong>地域制覇</div></div><button id="retry" class="primary">もう一度あそぶ</button> <button id="backHome" class="secondary">ホームへ戻る</button></div></section></div><div id="bigmark" class="bigmark"><span>○</span></div>
<script>
const $=id=>document.getElementById(id),screens={home:$("home"),game:$("game"),clear:$("clear")};let drag=null,correct=0,misses=0;function show(n){Object.values(screens).forEach(s=>s.classList.remove("active"));screens[n].classList.add("active");scrollTo({top:0,behavior:"smooth"})}function reset(){correct=0;misses=0;document.querySelectorAll(".choice").forEach(c=>c.className="choice");document.querySelectorAll(".target").forEach((t,i)=>{t.className="target";t.innerHTML=`<div><span class="num">${["①","②","③"][i]}</span>ここへ</div>`});$("bar").style.width="0%";$("plabel").textContent="0 / 3";$("feedback").textContent="好きなカードから始めよう";$("feedback").className="feedback";$("finish").classList.remove("show")}function start(){reset();show("game")}
document.querySelectorAll(".choice").forEach(card=>card.addEventListener("pointerdown",e=>{if(card.classList.contains("locked"))return;const g=document.createElement("div");g.className="ghost";g.textContent=card.dataset.value;document.body.appendChild(g);drag={card,ghost:g};card.classList.add("dragging");move(e.clientX,e.clientY);card.setPointerCapture?.(e.pointerId);card.addEventListener("pointermove",moving);card.addEventListener("pointerup",end,{once:true});card.addEventListener("pointercancel",end,{once:true})}));function moving(e){if(!drag)return;move(e.clientX,e.clientY);document.querySelectorAll(".target:not(.correct)").forEach(t=>t.classList.toggle("over",inside(e.clientX,e.clientY,t)))}function end(e){if(!drag)return;const {card,ghost}=drag,target=[...document.querySelectorAll(".target:not(.correct)")].find(t=>inside(e.clientX,e.clientY,t));ghost.remove();card.classList.remove("dragging");card.removeEventListener("pointermove",moving);document.querySelectorAll(".target").forEach(t=>t.classList.remove("over"));drag=null;if(target)check(card,target)}function move(x,y){drag.ghost.style.left=x+"px";drag.ghost.style.top=y+"px"}function inside(x,y,el){const r=el.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}function check(card,target){if(card.dataset.value===target.dataset.answer){correct++;card.classList.add("correct","locked");target.classList.add("correct");target.innerHTML=`<div><span class="num">✓</span>${target.dataset.answer}</div>`;$("bar").style.width=`${correct/3*100}%`;$("plabel").textContent=`${correct} / 3`;$("feedback").textContent=correct===3?"全部正解！ 3つの位置関係が見えてきたね。":`正解！ あと${3-correct}枚。`;$("feedback").className="feedback good";$("bigmark").classList.remove("show");void $("bigmark").offsetWidth;$("bigmark").classList.add("show");if(correct===3)$("finish").classList.add("show")}else{misses++;card.classList.add("wrong");target.classList.add("wrong");$("feedback").textContent="おしい！ 別の場所をためしてみよう。";$("feedback").className="feedback bad";setTimeout(()=>{card.classList.remove("wrong");target.classList.remove("wrong")},550)}}$("start").onclick=start;$("retry").onclick=start;$("backHome").onclick=()=>show("home");$("finish").onclick=()=>{$("missCount").textContent=misses;show("clear")};
</script></body></html>
