<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Geo Explorer v0.2.1</title>
<style>
:root{--bg1:#eaf7ff;--bg2:#fff8e8;--ink:#17324d;--sub:#63798e;--accent:#ff9f43;--accent2:#4bb3fd;--good:#2ecc71;--warn:#f5b942;--panel:rgba(255,255,255,.9);--shadow:0 12px 28px rgba(36,73,105,.15)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--ink)}body{background:radial-gradient(circle at 10% 10%,rgba(255,255,255,.95),transparent 30%),linear-gradient(145deg,var(--bg1),var(--bg2))}button{font:inherit}.app{height:100dvh;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}.screen{display:none;height:100%}.screen.active{display:flex}.center-screen{align-items:center;justify-content:center}.hero{width:min(760px,94vw);background:var(--panel);backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,.85);border-radius:28px;box-shadow:var(--shadow);padding:clamp(26px,5vw,54px);text-align:center}.logo{font-size:clamp(42px,7vw,72px);line-height:1;margin-bottom:10px}h1{font-size:clamp(30px,5vw,54px);margin:0}.subtitle{font-size:clamp(15px,2vw,21px);color:var(--sub);margin:12px 0 26px}.primary{border:0;border-radius:17px;padding:15px 30px;background:linear-gradient(135deg,var(--accent),#ffbf69);color:#fff;font-weight:900;font-size:19px;box-shadow:0 7px 0 #d87924;cursor:pointer}.primary:active{transform:translateY(4px);box-shadow:0 3px 0 #d87924}.secondary{border:2px solid #c8d9e6;border-radius:15px;padding:12px 20px;background:#fff;color:var(--ink);font-weight:850;font-size:16px;cursor:pointer}.small-note{margin-top:18px;color:var(--sub);font-size:13px}#gameScreen{flex-direction:column;gap:7px;min-height:0}.topbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;max-width:1180px;width:100%;margin:0 auto;flex:0 0 auto}.left-tools,.right-tools{display:flex;align-items:center;gap:7px}.icon-btn,.tool-btn{border:0;background:rgba(255,255,255,.9);box-shadow:0 5px 14px rgba(36,73,105,.11);cursor:pointer}.icon-btn{width:42px;height:42px;border-radius:13px;font-size:21px}.tool-btn{min-height:40px;padding:8px 11px;border-radius:13px;color:var(--ink);font-size:13px;font-weight:850;white-space:nowrap}.tool-btn.active{background:#dff4ff;box-shadow:inset 0 0 0 2px #75c7f2}.title-wrap{text-align:center;min-width:0}.stage-title{font-size:clamp(20px,2.6vw,29px);font-weight:950;line-height:1.05}.stage-sub{font-size:12px;color:var(--sub);margin-top:2px}.score{font-weight:900;background:#fff;border-radius:14px;padding:10px 13px;box-shadow:0 5px 14px rgba(36,73,105,.1);white-space:nowrap;font-size:14px}.progress-shell{flex:0 0 auto;height:9px;background:rgba(255,255,255,.75);border-radius:99px;overflow:hidden;width:min(690px,70vw);margin:0 auto;box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--good));transition:width .35s ease;border-radius:99px}.game-layout{width:min(1180px,100%);margin:0 auto;flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(116px,172px) minmax(420px,1fr) minmax(116px,172px);grid-template-areas:"left map right";gap:10px 14px;align-items:center}.game-layout.bottom-mode{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"map" "bottom";gap:8px}.side-stack{display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;min-height:0}#leftCards{grid-area:left}#rightCards{grid-area:right}#bottomCards{grid-area:bottom;flex-direction:row;flex-wrap:nowrap;justify-content:center;min-height:0}.bottom-mode #leftCards,.bottom-mode #rightCards{display:none}.map-panel{grid-area:map;position:relative;width:100%;height:100%;min-height:0;max-height:100%;margin:auto;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.96),rgba(255,255,255,.74)),repeating-linear-gradient(0deg,transparent 0 30px,rgba(75,179,253,.05) 30px 31px),repeating-linear-gradient(90deg,transparent 0 30px,rgba(75,179,253,.05) 30px 31px);border-radius:26px;border:3px solid rgba(255,255,255,.96);box-shadow:var(--shadow);overflow:hidden;touch-action:none}.game-layout:not(.bottom-mode) .map-panel{aspect-ratio:1.34/1}.bottom-mode .map-panel{width:min(920px,100%);aspect-ratio:1.58/1}.map-caption{position:absolute;left:14px;top:11px;z-index:3;background:rgba(255,255,255,.86);padding:6px 10px;border-radius:10px;font-size:12px;color:var(--sub);font-weight:850}.map-svg{position:absolute;inset:3% 4% 4%;width:92%;height:93%}.island{fill:#f1e6ce;stroke:#9d7a50;stroke-width:5;filter:drop-shadow(0 7px 6px rgba(65,53,37,.13))}.ridge{fill:none;stroke:#d9c4a2;stroke-width:3;stroke-dasharray:7 8;opacity:.85}.target{position:absolute;width:104px;height:72px;transform:translate(-50%,-50%);border:3px dashed rgba(23,50,77,.42);border-radius:20px;background:rgba(255,255,255,.62);display:flex;align-items:center;justify-content:center;text-align:center;padding:7px;color:rgba(23,50,77,.67);font-weight:900;font-size:14px;line-height:1.22;transition:.18s ease;z-index:2}.target::after{content:"ここへ";font-size:12px}.target.hover{transform:translate(-50%,-50%) scale(1.10);border-color:var(--accent2);background:rgba(75,179,253,.22);box-shadow:0 0 0 7px rgba(75,179,253,.11)}.target.correct{border-style:solid;border-color:var(--good);background:#e8fff0;color:#168a46;box-shadow:0 8px 18px rgba(46,204,113,.17)}.target.correct::after{content:"✓\A" attr(data-label);white-space:pre-line;font-size:14px;line-height:1.2}.card{width:clamp(116px,12vw,154px);min-height:clamp(84px,9.6vw,110px);border:0;border-radius:20px;background:linear-gradient(145deg,#fff,#eef8ff);box-shadow:0 8px 0 #c7dcec,0 14px 22px rgba(36,73,105,.13);color:var(--ink);font-size:clamp(17px,1.8vw,21px);font-weight:950;line-height:1.16;padding:12px 10px;display:flex;align-items:center;justify-content:center;text-align:center;touch-action:none;user-select:none;cursor:grab;position:relative}.bottom-mode .card{width:clamp(155px,22vw,260px);min-height:72px}.card::before{content:"≡";position:absolute;top:6px;right:10px;font-size:12px;color:#9bb5ca;letter-spacing:-2px}.card.dragging{position:fixed!important;z-index:9999!important;margin:0!important;pointer-events:none;transform:scale(1.08) rotate(-1.5deg);box-shadow:0 18px 34px rgba(36,73,105,.28);opacity:.97}.feedback{position:fixed;left:50%;top:16%;transform:translate(-50%,-50%) scale(.7);padding:10px 19px;border-radius:999px;background:#fff;font-weight:950;font-size:20px;box-shadow:var(--shadow);opacity:0;pointer-events:none;z-index:10000}.feedback.show{animation:pop .65s ease}.feedback.good{color:#168a46}.feedback.warn{color:#b57a11}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.65)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(.96)}}@keyframes wiggle{0%,100%{transform:translate(-50%,-50%) rotate(0)}25%{transform:translate(-50%,-50%) rotate(-3deg)}75%{transform:translate(-50%,-50%) rotate(3deg)}}.target.wrong{animation:wiggle .34s ease;border-color:var(--warn)}.clear-badge{font-size:clamp(56px,9vw,105px);margin-bottom:7px}.clear-stats{font-size:19px;font-weight:850;margin:16px 0 25px}.clear-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}@media (max-width:850px) and (orientation:landscape){.game-layout{grid-template-columns:minmax(104px,138px) minmax(360px,1fr) minmax(104px,138px);gap:8px}.card{width:118px;min-height:78px;font-size:17px}.target{width:92px;height:64px}.stage-sub{display:none}.tool-btn{padding:7px 9px}}@media (orientation:portrait){html,body{overflow:auto}.app{height:auto;min-height:100dvh}.screen{min-height:100dvh;height:auto}.game-layout,.game-layout.bottom-mode{grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;grid-template-areas:"map map" "left right" "bottom bottom"}.map-panel,.bottom-mode .map-panel{aspect-ratio:1.12/1;min-height:410px}.side-stack{flex-direction:row;flex-wrap:wrap}.bottom-mode #leftCards,.bottom-mode #rightCards{display:flex}#bottomCards{flex-wrap:wrap}.card,.bottom-mode .card{width:min(42vw,180px);min-height:82px}}
</style>
</head>
<body>
<div class="app">
<section id="homeScreen" class="screen center-screen active"><div class="hero"><div class="logo">🧭</div><h1>Geo Explorer</h1><p class="subtitle">ドラッグして、世界を組み立てよう。</p><button id="startBtn" class="primary">北海道へ出発</button><div class="small-note">Level 1｜正しい用語だけで地図を完成させる</div></div></section>
<section id="gameScreen" class="screen"><header class="topbar"><div class="left-tools"><button id="homeBtn" class="icon-btn">⌂</button><button id="layoutBtn" class="tool-btn">配置：左右</button></div><div class="title-wrap"><div class="stage-title">北海道の3つの山地</div><div class="stage-sub">正しい場所へドラッグ。置く順番は自由です。</div></div><div class="right-tools"><button id="soundBtn" class="tool-btn active">🔊 音あり</button><div id="score" class="score">0 / 3</div></div></header><div class="progress-shell"><div id="progressBar" class="progress-bar"></div></div><main id="gameLayout" class="game-layout"><div id="leftCards" class="side-stack"></div><section class="map-panel"><div class="map-caption">北海道</div><svg class="map-svg" viewBox="0 0 800 560"><path class="island" d="M92,210 C120,176 159,170 192,172 C220,146 250,120 285,108 C317,96 344,73 378,70 C408,67 436,84 462,101 C497,92 527,72 563,66 C600,61 626,76 632,105 C639,136 620,164 605,190 C633,198 668,207 699,226 C721,241 724,261 705,273 C682,286 650,284 622,278 C601,309 573,335 542,352 C541,393 532,431 512,461 C497,485 472,500 450,488 C429,477 428,447 431,420 C399,426 363,430 326,426 C291,423 259,410 236,386 C207,393 175,390 153,371 C134,355 128,331 132,307 C102,293 76,274 61,251 C49,232 62,217 92,210 Z"/><path class="ridge" d="M250,176 C302,218 326,273 330,339"/><path class="ridge" d="M470,168 C430,235 416,304 430,383"/><path class="ridge" d="M572,172 C593,218 591,272 596,320"/></svg><div class="target" data-target="kitami" style="left:72%;top:31%"></div><div class="target" data-target="ishikari" style="left:52%;top:43%"></div><div class="target" data-target="hidaka" style="left:55%;top:70%"></div></section><div id="rightCards" class="side-stack"></div><div id="bottomCards" class="side-stack"></div></main></section>
<section id="clearScreen" class="screen center-screen"><div class="hero"><div class="clear-badge">🏔️✨</div><h1>北海道クリア！</h1><p class="subtitle">地図が完成しました。</p><div id="clearStats" class="clear-stats"></div><div class="clear-actions"><button id="retryBtn" class="primary">もう一度あそぶ</button><button id="clearHomeBtn" class="secondary">ホーム</button></div></div></section>
</div><div id="feedback" class="feedback"></div>
<script>
(()=>{"use strict";const DATA=[{id:"kitami",label:"北見\n山地",spoken:"北見山地"},{id:"ishikari",label:"石狩\n山地",spoken:"石狩山地"},{id:"hidaka",label:"日高\n山脈",spoken:"日高山脈"}];const $=id=>document.getElementById(id);const screens={home:$("homeScreen"),game:$("gameScreen"),clear:$("clearScreen")};let placed=0,mistakes=0,dragState=null,soundOn=true,layoutMode="side",audioContext=null;function showScreen(name){Object.values(screens).forEach(s=>s.classList.remove("active"));screens[name].classList.add("active")}function ensureAudio(){if(!audioContext)audioContext=new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==="suspended")audioContext.resume()}function tone(freq,start,duration,type="sine",volume=.05){if(!soundOn)return;ensureAudio();const o=audioContext.createOscillator(),g=audioContext.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioContext.currentTime+start);g.gain.setValueAtTime(.0001,audioContext.currentTime+start);g.gain.exponentialRampToValueAtTime(volume,audioContext.currentTime+start+.01);g.gain.exponentialRampToValueAtTime(.0001,audioContext.currentTime+start+duration);o.connect(g).connect(audioContext.destination);o.start(audioContext.currentTime+start);o.stop(audioContext.currentTime+start+duration+.02)}function pickup(){tone(410,0,.07,"triangle",.025)}function correct(){tone(660,0,.12,"sine",.055);tone(880,.12,.18,"sine",.06)}function closeSound(){tone(740,0,.08,"triangle",.035);tone(590,.08,.09,"triangle",.03);tone(700,.17,.12,"triangle",.028)}function clearSound(){[523,659,784,1046].forEach((f,i)=>tone(f,i*.11,.22,"sine",.045))}function resetTargets(){document.querySelectorAll(".target").forEach(t=>{t.classList.remove("correct","hover","wrong");t.removeAttribute("data-label")})}function makeCard(item){const c=document.createElement("button");c.type="button";c.className="card";c.dataset.id=item.id;c.dataset.label=item.label;c.setAttribute("aria-label",item.spoken);c.innerHTML=item.label.replace("\n","<br>");c.addEventListener("pointerdown",beginDrag);return c}function distribute(){$("leftCards").innerHTML="";$("rightCards").innerHTML="";$("bottomCards").innerHTML="";const cards=DATA.map(makeCard);if(layoutMode==="bottom")cards.forEach(c=>$("bottomCards").appendChild(c));else{$("leftCards").appendChild(cards[0]);$("rightCards").appendChild(cards[1]);$("rightCards").appendChild(cards[2])}}function startGame(){placed=0;mistakes=0;resetTargets();distribute();update();showScreen("game")}function update(){$("score").textContent=`${placed} / ${DATA.length}`;$("progressBar").style.width=`${placed/DATA.length*100}%`}function toggleLayout(){layoutMode=layoutMode==="side"?"bottom":"side";$("gameLayout").classList.toggle("bottom-mode",layoutMode==="bottom");$("layoutBtn").textContent=layoutMode==="side"?"配置：左右":"配置：下";startGame()}function toggleSound(){soundOn=!soundOn;$("soundBtn").classList.toggle("active",soundOn);$("soundBtn").textContent=soundOn?"🔊 音あり":"🔇 音なし";if(soundOn)pickup()}function beginDrag(e){if(e.button!==undefined&&e.button!==0)return;const card=e.currentTarget;e.preventDefault();pickup();const r=card.getBoundingClientRect();dragState={card,pointerId:e.pointerId,offsetX:e.clientX-r.left,offsetY:e.clientY-r.top,parent:card.parentElement,next:card.nextSibling};Object.assign(card.style,{width:r.width+"px",height:r.height+"px",left:r.left+"px",top:r.top+"px"});card.classList.add("dragging");document.body.appendChild(card);try{card.setPointerCapture(e.pointerId)}catch(_){ }moveDrag(e);card.addEventListener("pointermove",moveDrag);card.addEventListener("pointerup",endDrag);card.addEventListener("pointercancel",cancelDrag)}function moveDrag(e){if(!dragState||e.pointerId!==dragState.pointerId)return;const{card,offsetX,offsetY}=dragState;card.style.left=e.clientX-offsetX+"px";card.style.top=e.clientY-offsetY+"px";document.querySelectorAll(".target.hover").forEach(t=>t.classList.remove("hover"));card.style.visibility="hidden";const below=document.elementFromPoint(e.clientX,e.clientY);card.style.visibility="visible";const target=below?.closest?.(".target");if(target&&!target.classList.contains("correct"))target.classList.add("hover")}function endDrag(e){if(!dragState||e.pointerId!==dragState.pointerId)return;const{card}=dragState;card.style.visibility="hidden";const below=document.elementFromPoint(e.clientX,e.clientY);card.style.visibility="visible";const target=below?.closest?.(".target");cleanup(card);document.querySelectorAll(".target.hover").forEach(t=>t.classList.remove("hover"));if(target&&!target.classList.contains("correct")&&target.dataset.target===card.dataset.id)placeCorrect(card,target);else{mistakes++;if(target&&!target.classList.contains("correct")){target.classList.add("wrong");setTimeout(()=>target.classList.remove("wrong"),380)}closeSound();feedback("おしい！",false);returnCard(card)}}function cancelDrag(){if(!dragState)return;cleanup(dragState.card);returnCard(dragState.card)}function cleanup(card){card.removeEventListener("pointermove",moveDrag);card.removeEventListener("pointerup",endDrag);card.removeEventListener("pointercancel",cancelDrag);try{card.releasePointerCapture(dragState.pointerId)}catch(_){ }}function placeCorrect(card,target){const item=DATA.find(i=>i.id===card.dataset.id);target.dataset.label=item.label;target.classList.add("correct");const tr=target.getBoundingClientRect();card.style.transition="left .22s ease, top .22s ease, transform .22s ease, opacity .22s ease";card.style.left=tr.left+(tr.width-card.offsetWidth)/2+"px";card.style.top=tr.top+(tr.height-card.offsetHeight)/2+"px";card.style.transform="scale(.78)";placed++;update();correct();feedback("正解！",true);setTimeout(()=>{card.remove();dragState=null;if(placed===DATA.length)setTimeout(()=>{clearSound();showClear()},620)},230)}function returnCard(card){const s=dragState;if(s.next&&s.next.parentElement===s.parent)s.parent.insertBefore(card,s.next);else s.parent.appendChild(card);card.classList.remove("dragging");card.removeAttribute("style");card.animate([{transform:"scale(1.04)"},{transform:"scale(.96)"},{transform:"scale(1)"}],{duration:230,easing:"ease-out"});dragState=null}function feedback(text,good){const f=$("feedback");f.textContent=text;f.className="feedback "+(good?"good":"warn");void f.offsetWidth;f.classList.add("show")}function showClear(){$("clearStats").textContent=mistakes===0?"パーフェクト！ まちがい 0回":`クリア！ まちがい ${mistakes}回`;showScreen("clear")}$("startBtn").addEventListener("click",()=>{ensureAudio();startGame()});$("retryBtn").addEventListener("click",startGame);$("homeBtn").addEventListener("click",()=>showScreen("home"));$("clearHomeBtn").addEventListener("click",()=>showScreen("home"));$("layoutBtn").addEventListener("click",toggleLayout);$("soundBtn").addEventListener("click",toggleSound);window.addEventListener("contextmenu",e=>{if(e.target.closest(".card"))e.preventDefault()})})();
</script>
</body>
</html>
