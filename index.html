<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Geo Explorer v0.2</title>
<style>
:root{--bg1:#eaf7ff;--bg2:#fff8e8;--ink:#17324d;--sub:#5f7488;--accent:#ff9f43;--accent2:#4bb3fd;--good:#2ecc71;--bad:#ff6b6b;--panel:rgba(255,255,255,.88);--shadow:0 14px 34px rgba(36,73,105,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--ink)}body{min-height:100dvh;background:radial-gradient(circle at 10% 10%,rgba(255,255,255,.9),transparent 30%),linear-gradient(145deg,var(--bg1),var(--bg2));overflow-x:hidden}button{font:inherit}.app{min-height:100dvh;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}.screen{display:none;min-height:calc(100dvh - 30px)}.screen.active{display:flex}.center-screen{align-items:center;justify-content:center}
.hero{width:min(760px,94vw);background:var(--panel);backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,.82);border-radius:30px;box-shadow:var(--shadow);padding:clamp(28px,5vw,58px);text-align:center}.logo{font-size:clamp(38px,7vw,72px);line-height:1;margin:0 0 12px}h1{font-size:clamp(32px,5vw,56px);margin:0}.subtitle{font-size:clamp(16px,2.2vw,22px);color:var(--sub);margin:14px 0 30px}.primary{border:0;border-radius:18px;padding:16px 34px;background:linear-gradient(135deg,var(--accent),#ffbf69);color:#fff;font-weight:800;font-size:20px;box-shadow:0 8px 0 #d87924;cursor:pointer;transition:.15s transform,.15s box-shadow}.primary:active{transform:translateY(5px);box-shadow:0 3px 0 #d87924}.small-note{margin-top:22px;color:var(--sub);font-size:14px}
#gameScreen{flex-direction:column;gap:12px}.topbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;max-width:1180px;width:100%;margin:0 auto}.icon-btn{width:48px;height:48px;border:0;border-radius:15px;background:rgba(255,255,255,.88);box-shadow:0 6px 18px rgba(36,73,105,.12);font-size:24px;cursor:pointer}.title-wrap{text-align:center}.stage-title{font-size:clamp(21px,3vw,32px);font-weight:900}.stage-sub{font-size:14px;color:var(--sub);margin-top:2px}.score{font-weight:900;background:#fff;border-radius:16px;padding:12px 16px;box-shadow:0 6px 18px rgba(36,73,105,.1);white-space:nowrap}.progress-shell{height:14px;background:rgba(255,255,255,.72);border-radius:99px;overflow:hidden;width:min(760px,78vw);margin:0 auto;box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--good));transition:width .35s ease;border-radius:99px}
.game-layout{position:relative;width:min(1180px,100%);margin:0 auto;flex:1;display:grid;grid-template-columns:minmax(120px,190px) minmax(340px,1fr) minmax(120px,190px);grid-template-areas:"left map right" "bottom bottom bottom";gap:14px 18px;align-items:center}.side-stack{display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;min-height:280px}#leftCards{grid-area:left}#rightCards{grid-area:right}#bottomCards{grid-area:bottom;flex-direction:row;min-height:110px;flex-wrap:wrap}.map-panel{grid-area:map;position:relative;width:100%;max-width:760px;margin:auto;aspect-ratio:1.3/1;min-height:420px;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.95),rgba(255,255,255,.72)),repeating-linear-gradient(0deg,transparent 0 32px,rgba(75,179,253,.055) 32px 33px),repeating-linear-gradient(90deg,transparent 0 32px,rgba(75,179,253,.055) 32px 33px);border-radius:30px;border:3px solid rgba(255,255,255,.95);box-shadow:var(--shadow);overflow:hidden;touch-action:none}.map-caption{position:absolute;left:18px;top:15px;z-index:3;background:rgba(255,255,255,.86);padding:8px 12px;border-radius:12px;font-size:13px;color:var(--sub);font-weight:700}.map-svg{position:absolute;inset:5% 5% 6%;width:90%;height:89%}.island{fill:#cfeecb;stroke:#479b73;stroke-width:5;filter:drop-shadow(0 8px 7px rgba(43,94,78,.16))}.coast{fill:none;stroke:rgba(255,255,255,.8);stroke-width:2}
.target{position:absolute;width:104px;height:76px;transform:translate(-50%,-50%);border:3px dashed rgba(23,50,77,.42);border-radius:20px;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;text-align:center;padding:7px;color:rgba(23,50,77,.68);font-weight:900;font-size:14px;line-height:1.25;transition:.18s ease;z-index:2}.target::after{content:"ここへ";font-size:12px}.target.hover{transform:translate(-50%,-50%) scale(1.10);border-color:var(--accent2);background:rgba(75,179,253,.22);box-shadow:0 0 0 8px rgba(75,179,253,.12)}.target.correct{border-style:solid;border-color:var(--good);background:rgba(255,255,255,.92);color:#168a46;box-shadow:0 9px 20px rgba(46,204,113,.18)}.target.correct::after{content:attr(data-label);font-size:15px;white-space:pre-line}
.card{width:clamp(116px,13vw,158px);min-height:clamp(96px,11vw,124px);border:0;border-radius:22px;background:linear-gradient(145deg,#fff,#edf7ff);box-shadow:0 9px 0 #c7dcec,0 16px 24px rgba(36,73,105,.14);color:var(--ink);font-size:clamp(17px,2vw,22px);font-weight:900;line-height:1.18;padding:14px 12px;display:flex;align-items:center;justify-content:center;text-align:center;touch-action:none;user-select:none;cursor:grab;position:relative;transition:transform .16s ease,box-shadow .16s ease,opacity .2s ease}.card::before{content:"≡";position:absolute;top:8px;right:11px;font-size:13px;color:#9bb5ca;letter-spacing:-2px}.card:active{cursor:grabbing}.card.dragging{position:fixed!important;z-index:9999!important;margin:0!important;pointer-events:none;transform:scale(1.08) rotate(-1.5deg);box-shadow:0 18px 36px rgba(36,73,105,.28);opacity:.96}.card.placed{opacity:0;transform:scale(.8);pointer-events:none}
.feedback{position:fixed;left:50%;top:18%;transform:translate(-50%,-50%) scale(.7);padding:12px 22px;border-radius:999px;background:#fff;font-weight:1000;font-size:22px;box-shadow:var(--shadow);opacity:0;pointer-events:none;z-index:10000}.feedback.show{animation:pop .65s ease}.feedback.good{color:#168a46}.feedback.bad{color:#d64f4f}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.65)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(.95)}}@keyframes wiggle{0%,100%{transform:translate(-50%,-50%) rotate(0)}25%{transform:translate(-50%,-50%) rotate(-3deg)}75%{transform:translate(-50%,-50%) rotate(3deg)}}.target.wrong{animation:wiggle .35s ease;border-color:var(--bad)}.clear-badge{font-size:clamp(58px,10vw,110px);margin-bottom:8px}.clear-stats{font-size:20px;font-weight:800;margin:18px 0 28px}.secondary{border:2px solid #bfd5e7;border-radius:16px;padding:13px 24px;background:#fff;color:var(--ink);font-weight:800;font-size:17px;cursor:pointer;margin-left:10px}
@media (max-width:760px),(orientation:portrait){.app{padding:10px}.topbar{grid-template-columns:44px 1fr auto;gap:8px}.icon-btn{width:42px;height:42px}.score{padding:9px 11px;font-size:14px}.game-layout{grid-template-columns:1fr 1fr;grid-template-areas:"map map" "left right" "bottom bottom";gap:10px;align-items:start}.map-panel{min-height:0;aspect-ratio:1.15/1}.side-stack{min-height:0;flex-direction:row;flex-wrap:wrap;gap:10px}#bottomCards{min-height:0}.card{width:min(42vw,170px);min-height:82px}.target{width:90px;height:66px}}@media (max-height:620px) and (orientation:landscape){.app{padding:8px}#gameScreen{gap:7px}.topbar{grid-template-columns:42px 1fr auto}.icon-btn{width:40px;height:40px}.stage-title{font-size:23px}.stage-sub{display:none}.progress-shell{height:10px}.game-layout{gap:8px 12px}.map-panel{min-height:350px;max-width:650px}.card{min-height:82px;width:130px;font-size:18px}.side-stack{gap:11px}}
</style>
</head>
<body>
<div class="app">
<section id="homeScreen" class="screen center-screen active"><div class="hero"><div class="logo">🧭</div><h1>Geo Explorer</h1><p class="subtitle">地図に名前を置いて、北海道を探検しよう。</p><button id="startBtn" class="primary">北海道へ出発</button><div class="small-note">v0.2｜複数配置・iPad向け左右レイアウト</div></div></section>
<section id="gameScreen" class="screen"><header class="topbar"><button id="homeBtn" class="icon-btn" aria-label="ホームへ戻る">⌂</button><div class="title-wrap"><div class="stage-title">北海道の山地・山脈</div><div class="stage-sub">カードを正しい場所へドラッグしよう</div></div><div id="score" class="score">0 / 3</div></header><div class="progress-shell"><div id="progressBar" class="progress-bar"></div></div><main class="game-layout"><div id="leftCards" class="side-stack"></div><section id="mapPanel" class="map-panel" aria-label="北海道地図"><div class="map-caption">北海道</div><svg class="map-svg" viewBox="0 0 800 560" role="img" aria-label="北海道の簡略地図"><path class="island" d="M92,210 C120,176 159,170 192,172 C220,146 250,120 285,108 C317,96 344,73 378,70 C408,67 436,84 462,101 C497,92 527,72 563,66 C600,61 626,76 632,105 C639,136 620,164 605,190 C633,198 668,207 699,226 C721,241 724,261 705,273 C682,286 650,284 622,278 C601,309 573,335 542,352 C541,393 532,431 512,461 C497,485 472,500 450,488 C429,477 428,447 431,420 C399,426 363,430 326,426 C291,423 259,410 236,386 C207,393 175,390 153,371 C134,355 128,331 132,307 C102,293 76,274 61,251 C49,232 62,217 92,210 Z"/><path class="coast" d="M115,225 C165,205 205,200 250,178 C305,151 350,108 405,98"/><path class="coast" d="M458,122 C520,105 580,91 612,118"/><path class="coast" d="M157,316 C205,337 260,352 316,346"/></svg><div class="target" data-target="kitami" style="left:72%;top:31%"></div><div class="target" data-target="ishikari" style="left:52%;top:43%"></div><div class="target" data-target="hidaka" style="left:55%;top:70%"></div></section><div id="rightCards" class="side-stack"></div><div id="bottomCards" class="side-stack"></div></main></section>
<section id="clearScreen" class="screen center-screen"><div class="hero"><div class="clear-badge">🏔️✨</div><h1>北海道クリア！</h1><p class="subtitle">3つの山地・山脈をすべて配置できました。</p><div id="clearStats" class="clear-stats"></div><button id="retryBtn" class="primary">もう一度あそぶ</button><button id="clearHomeBtn" class="secondary">ホーム</button></div></section>
</div><div id="feedback" class="feedback"></div>
<script>
(()=>{"use strict";const GAME_DATA={items:[{id:"kitami",label:"北見\n山地",spoken:"北見山地",slot:"left"},{id:"ishikari",label:"石狩\n山地",spoken:"石狩山地",slot:"right"},{id:"hidaka",label:"日高\n山脈",spoken:"日高山脈",slot:"bottom"}]};const screens={home:document.getElementById("homeScreen"),game:document.getElementById("gameScreen"),clear:document.getElementById("clearScreen")};const leftCards=document.getElementById("leftCards"),rightCards=document.getElementById("rightCards"),bottomCards=document.getElementById("bottomCards"),progressBar=document.getElementById("progressBar"),score=document.getElementById("score"),feedback=document.getElementById("feedback"),clearStats=document.getElementById("clearStats");let placed=0,mistakes=0,dragState=null;function showScreen(name){Object.values(screens).forEach(s=>s.classList.remove("active"));screens[name].classList.add("active")}function resetTargets(){document.querySelectorAll(".target").forEach(t=>{t.classList.remove("correct","hover","wrong");t.removeAttribute("data-label")})}function createCard(item){const c=document.createElement("button");c.className="card";c.type="button";c.dataset.id=item.id;c.dataset.label=item.label;c.setAttribute("aria-label",item.spoken);c.innerHTML=item.label.replace("\n","<br>");c.addEventListener("pointerdown",beginDrag);return c}function startGame(){placed=0;mistakes=0;leftCards.innerHTML="";rightCards.innerHTML="";bottomCards.innerHTML="";resetTargets();GAME_DATA.items.forEach(item=>{const c=createCard(item);if(item.slot==="left")leftCards.appendChild(c);else if(item.slot==="right")rightCards.appendChild(c);else bottomCards.appendChild(c)});updateProgress();showScreen("game")}function updateProgress(){score.textContent=`${placed} / ${GAME_DATA.items.length}`;progressBar.style.width=`${placed/GAME_DATA.items.length*100}%`}function beginDrag(e){if(e.button!==undefined&&e.button!==0)return;const c=e.currentTarget;if(c.classList.contains("placed"))return;e.preventDefault();const r=c.getBoundingClientRect();dragState={card:c,pointerId:e.pointerId,offsetX:e.clientX-r.left,offsetY:e.clientY-r.top,homeParent:c.parentElement,homeNext:c.nextSibling};c.style.width=r.width+"px";c.style.height=r.height+"px";c.style.left=r.left+"px";c.style.top=r.top+"px";c.classList.add("dragging");document.body.appendChild(c);try{c.setPointerCapture(e.pointerId)}catch(_){}moveDrag(e);c.addEventListener("pointermove",moveDrag);c.addEventListener("pointerup",endDrag);c.addEventListener("pointercancel",cancelDrag)}function moveDrag(e){if(!dragState||e.pointerId!==dragState.pointerId)return;const{card,offsetX,offsetY}=dragState;card.style.left=e.clientX-offsetX+"px";card.style.top=e.clientY-offsetY+"px";document.querySelectorAll(".target.hover").forEach(t=>t.classList.remove("hover"));card.style.visibility="hidden";const below=document.elementFromPoint(e.clientX,e.clientY);card.style.visibility="visible";const target=below&&below.closest?below.closest(".target"):null;if(target&&!target.classList.contains("correct"))target.classList.add("hover")}function endDrag(e){if(!dragState||e.pointerId!==dragState.pointerId)return;const{card}=dragState;card.style.visibility="hidden";const below=document.elementFromPoint(e.clientX,e.clientY);card.style.visibility="visible";const target=below&&below.closest?below.closest(".target"):null;cleanup(card);document.querySelectorAll(".target.hover").forEach(t=>t.classList.remove("hover"));if(target&&!target.classList.contains("correct")&&target.dataset.target===card.dataset.id)placeCorrect(card,target);else{if(target&&!target.classList.contains("correct")){mistakes++;target.classList.add("wrong");setTimeout(()=>target.classList.remove("wrong"),400);showFeedback("おしい！",false)}returnCard(card)}}function cancelDrag(){if(!dragState)return;cleanup(dragState.card);document.querySelectorAll(".target.hover").forEach(t=>t.classList.remove("hover"));returnCard(dragState.card)}function cleanup(card){card.removeEventListener("pointermove",moveDrag);card.removeEventListener("pointerup",endDrag);card.removeEventListener("pointercancel",cancelDrag);try{card.releasePointerCapture(dragState.pointerId)}catch(_){}}function placeCorrect(card,target){const item=GAME_DATA.items.find(i=>i.id===card.dataset.id);target.dataset.label=item.label;target.classList.add("correct");const r=target.getBoundingClientRect();card.style.transition="left .22s ease, top .22s ease, transform .22s ease, opacity .22s ease";card.style.left=r.left+(r.width-card.offsetWidth)/2+"px";card.style.top=r.top+(r.height-card.offsetHeight)/2+"px";card.style.transform="scale(.78)";placed++;updateProgress();showFeedback("正解！",true);setTimeout(()=>{card.remove();dragState=null;if(placed===GAME_DATA.items.length)setTimeout(showClear,650)},230)}function returnCard(card){const s=dragState,p=s.homeParent;if(s.homeNext&&s.homeNext.parentElement===p)p.insertBefore(card,s.homeNext);else p.appendChild(card);card.classList.remove("dragging");card.removeAttribute("style");card.animate([{transform:"scale(1.04)"},{transform:"scale(.96)"},{transform:"scale(1)"}],{duration:240,easing:"ease-out"});dragState=null}function showFeedback(text,good){feedback.textContent=text;feedback.className="feedback "+(good?"good":"bad");void feedback.offsetWidth;feedback.classList.add("show")}function showClear(){clearStats.textContent=mistakes===0?"パーフェクト！ まちがい 0回":`クリア！ まちがい ${mistakes}回`;showScreen("clear")}document.getElementById("startBtn").addEventListener("click",startGame);document.getElementById("retryBtn").addEventListener("click",startGame);document.getElementById("homeBtn").addEventListener("click",()=>showScreen("home"));document.getElementById("clearHomeBtn").addEventListener("click",()=>showScreen("home"));window.addEventListener("contextmenu",e=>{if(e.target.closest(".card"))e.preventDefault()})})();
</script>
</body>
</html>
