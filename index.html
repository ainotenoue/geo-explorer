<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#e7f5f7">
<title>Geo Explorer v5.0</title>
<style>
:root{
  --ink:#18364b;
  --muted:#6b8190;
  --panel:#fffdf8;
  --line:#d7e4e6;
  --accent:#267b63;
  --shadow:0 10px 24px rgba(28,66,86,.13);
  --journey:420ms;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  color:var(--ink);
  background:linear-gradient(180deg,#e7f5f7,#f6fbf8);
  -webkit-user-select:none;
  user-select:none;
}
button{font:inherit}
.screen{
  position:absolute;
  inset:0;
  display:grid;
  visibility:hidden;
  opacity:0;
  transform:scale(.985);
  pointer-events:none;
  transition:
    opacity var(--journey) ease,
    transform var(--journey) cubic-bezier(.2,.75,.25,1),
    visibility 0s linear var(--journey);
}
.screen.active{
  visibility:visible;
  opacity:1;
  transform:scale(1);
  pointer-events:auto;
  transition-delay:0s;
}
.screen.leaving{
  opacity:0;
  transform:scale(1.025);
  pointer-events:none;
}

/* HOME */
#homeScreen{
  grid-template-rows:auto 1fr auto;
  gap:8px;
  padding:10px 12px;
  touch-action:manipulation;
}
.home-header{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  min-height:44px;
}
.title-wrap{display:flex;align-items:baseline;gap:10px}
h1{font-size:clamp(20px,2.5vw,30px);margin:0}
.version{font-size:12px;color:var(--muted);font-weight:700}
.home-copy{text-align:right}
.home-copy strong{display:block;font-size:clamp(14px,1.8vw,20px)}
.home-copy span{font-size:12px;color:var(--muted);font-weight:700}
.home-main{min-height:0;display:flex;align-items:center;justify-content:center}
.japan-panel{
  position:relative;
  height:100%;
  max-height:760px;
  aspect-ratio:620/760;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.japan-map{
  position:absolute;
  inset:4.5%;
  width:91%;
  height:91%;
  display:grid;
  place-items:center;
}
.japan-map svg{
  display:block;
  width:100%;
  height:100%;
  overflow:visible;
  transform-box:fill-box;
  transform-origin:center;
  transform:translateY(-1.8%) rotate(5deg) scale(.965);
}
.japan-map .region{
  cursor:default;
  transform-box:fill-box;
  transform-origin:center;
  transition:transform .17s ease,filter .17s ease,opacity .17s ease;
}
.japan-map #hokkaido,
.japan-map #tohoku{
  cursor:pointer;
}
.japan-map #hokkaido:hover,
.japan-map #hokkaido:focus,
.japan-map #tohoku:hover,
.japan-map #tohoku:focus{
  filter:brightness(1.055) saturate(1.08);
  transform:scale(1.018);
}
.japan-map #hokkaido:active,
.japan-map #tohoku:active{
  transform:scale(.985);
  opacity:.88;
}
.completion-medal{
  fill:#fff2b8;
  stroke:#c99316;
  stroke-width:6;
  paint-order:stroke fill;
  pointer-events:none;
  filter:url(#completion-star-glow);
}
.completion-medal-inner{
  fill:none;
  stroke:#e5bd43;
  stroke-width:3;
  pointer-events:none;
}
.completion-medal-star{
  fill:#c99316;
  stroke:none;
  pointer-events:none;
}
.home-footer{
  text-align:center;
  min-height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  color:#496b7a;
}

/* Geo Explorer next UI:
   - 10-card capacity: 5 left / 5 right (item side remains data-driven)
   - compact card height/gap
   - hint/drop zone: 38 x 38px, 2px dashed, slightly darker
   - map sizing/viewBox unchanged
*/
/* GAME */
#gameScreen{
  grid-template-rows:auto 1fr auto;
  gap:8px;
  padding:10px 12px;
  touch-action:none;
}
.game-header{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  min-height:44px;
}
.game-title{
  display:flex;
  align-items:center;
  gap:9px;
  justify-self:start;
}
.home-button{
  border:1px solid var(--line);
  border-radius:999px;
  background:#ffffffc7;
  color:#476575;
  font-weight:900;
  padding:7px 12px;
  transition:transform .15s ease,background .15s ease;
}
.home-button:active{transform:scale(.96);background:#fff}
.status-wrap{
  display:flex;
  align-items:center;
  gap:8px;
  justify-self:end;
}
.progress{
  text-align:center;
  background:#ffffffc7;
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 12px;
  font-weight:800;
  min-width:92px;
}
.game{
  min-height:0;
  display:grid;
  grid-template-columns:minmax(150px,22vw) minmax(0,1fr) minmax(150px,22vw);
  gap:10px;
}
.card-column{
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:9px;
  justify-content:center;
  width:82%;
}

/* Narrower card columns, kept close to the map.
   The freed space stays on the outside edges. */
.game > .card-column:first-child{
  justify-self:end;
}
.game > .card-column:last-child{
  justify-self:start;
}
.map-panel{
  position:relative;
  min-width:0;
  min-height:0;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:var(--shadow);
  overflow:visible;
}
.area-title{
  justify-self:center;
  font-size:clamp(26px,3.2vw,40px);
  font-weight:900;
  letter-spacing:.05em;
  color:var(--ink);
  white-space:nowrap;
  line-height:1;
}
.completion-actions{
  display:none;
  align-items:center;
  justify-content:center;
  gap:12px;
}
.completion-actions.show{display:flex}
.replay-button,.return-button{
  border-radius:999px;
  font-weight:900;
  padding:11px 24px;
  transition:transform .15s ease;
}
.replay-button{
  background:#fff;
  color:var(--accent);
  border:2px solid var(--accent);
}
.return-button{
  background:var(--accent);
  color:#fff;
  border:2px solid var(--accent);
}
.replay-button:active,.return-button:active{transform:scale(.96)}
.map-stage{
  position:absolute;
  inset:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity .28s ease,transform .28s ease;
}
.map-stage.switching{opacity:0;transform:scale(.965)}
.map-wrap{position:relative;flex:0 0 auto}
.map{width:100%;height:100%;display:block;pointer-events:none}
.drop-zone{
  position:absolute;
  transform:translate(-50%,-50%);
  width:38px;
  height:38px;
  border:2px dashed rgba(58,102,119,.55);
  border-radius:8px;
  background:#ffffff66;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2px;
  transition:.18s;
}
.drop-zone.hot{
  transform:translate(-50%,-50%) scale(1.08);
  border-color:#47a778;
  background:#dcf8e7ed;
}
.drop-zone.close{
  animation:wobble .36s;
  border-color:#e5b44f;
  background:#fff8db;
}
.drop-zone.filled{
  border-color:transparent;
  background:transparent;
  box-shadow:none;
}
.placed{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  text-align:center;
  font-weight:700;
  color:#294d5d;
  font-size:clamp(10px,1.18vw,14px);
  line-height:1.1;
  white-space:nowrap;
}
.placed img{
  width:clamp(26px,3.1vw,38px);
  height:clamp(20px,2.6vw,31px);
  object-fit:contain;
  opacity:.9;
}
.card{
  display:flex;
  align-items:center;
  gap:9px;
  min-height:49px;
  border:2px solid transparent;
  border-radius:16px;
  background:#fff;
  padding:5px 10px;
  box-shadow:0 6px 14px rgba(43,79,95,.10);
  cursor:grab;
  touch-action:none;
  transition:transform .15s ease,opacity .18s ease,box-shadow .15s ease;
}
.card.lifted{opacity:.22}
.card.done{opacity:0;pointer-events:none;transform:scale(.85)}
.card-icon{
  flex:0 0 auto;
  width:42px;
  height:36px;
  display:grid;
  place-items:center;
  border-radius:12px;
}
.card-icon img{width:34px;height:28px;object-fit:contain}
.card-name{
  font-weight:900;
  font-size:clamp(13px,1.6vw,18px);
  line-height:1.15;
  white-space:pre-line;
}
.category-mountain .card-icon{color:#a87916;background:#fff3cf}
.category-plain .card-icon{color:#328554;background:#e5f7e9}
.category-river .card-icon,.category-lake .card-icon{color:#247ba6;background:#e1f4fb}
.drag-ghost{
  position:fixed;
  z-index:1000;
  pointer-events:none;
  width:170px;
  max-width:26vw;
  transform:translate3d(-50%,-50%,0) scale(1.01);
  box-shadow:0 12px 24px rgba(22,57,76,.18);
  will-change:left,top,transform;
}
.game-footer{
  min-height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.message{font-weight:800;color:#496b7a;text-align:center}
.next-button{
  display:none;
  border:0;
  border-radius:999px;
  background:var(--accent);
  color:#fff;
  font-weight:900;
  padding:11px 28px;
  box-shadow:0 8px 16px rgba(38,123,99,.20);
  transition:transform .15s ease;
}
.next-button:active{transform:scale(.96)}
.next-button.show{display:block}
@keyframes wobble{
  25%{transform:translate(-50%,-50%) rotate(-2deg)}
  65%{transform:translate(-50%,-50%) rotate(2deg)}
}
@media(max-width:700px){
  .game-header{grid-template-columns:auto 1fr auto}
  .area-title{font-size:clamp(22px,4.6vw,32px)}
  .game{grid-template-columns:minmax(110px,25vw) minmax(0,1fr) minmax(110px,25vw)}
  .card{min-height:46px;padding:4px 7px}
  .card-icon{width:34px}
  .home-copy span{display:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}


/* --- Kanto Pack Categories --- */
.category-bay .card-icon{
  color:#247ba6;
  background:#e1f4fb;
}
.category-peninsula .card-icon{
  color:#8b6c42;
  background:#f5ead9;
}



/* Geo Explorer Chubu pack category addition */
.category-volcano .card-icon{
  color:#a85c32;
  background:#fde8d9;
}


.category-basin .card-icon{
  color:#8b6b46;
  background:#f3eadb;
}


.category-dune .card-icon{
  color:#9a7030;
  background:#fff1c9;
}


.category-cape .card-icon{
  color:#7a6848;
  background:#f3ead8;
}



/* Geo Explorer Kyushu-Okinawa pack category addition */
.category-island .card-icon{
  color:#2f7f91;
  background:#e3f5f7;
}


/* --- v4.2 Layer switch: 九州・沖縄 only --- */
.layer-switch{
  display:none;
  justify-self:center;
  align-items:center;
  gap:4px;
  padding:3px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#ffffffb8;
  box-shadow:0 4px 10px rgba(43,79,95,.08);
}
.layer-switch.show{display:flex}
.layer-button{
  border:0;
  border-radius:999px;
  background:transparent;
  color:#587382;
  font-weight:900;
  padding:6px 15px;
  min-width:72px;
  cursor:pointer;
  transition:background .16s ease,color .16s ease,transform .12s ease;
}
.layer-button.active{
  background:var(--accent);
  color:#fff;
}
.layer-button:active{transform:scale(.97)}


/* --- v4.4 Persistent medals: 九州・沖縄 only ---
   - no completion checkmarks in the layer switch
   - no "地方クリア" header badge
   - nature medal stays on Nature view after completion
   - life medal stays on Life view after completion
   - when both are complete, both views show the gold region medal
*/
.area-center{
  display:grid;
  justify-items:center;
  gap:5px;
}
.layer-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
#lifeLayerButton.active{
  background:#d88435;
  color:#fff;
}

.achievement-medal{
  position:absolute;
  top:-24px;
  right:-28px;
  z-index:8;
  width:116px;
  height:116px;
  border-radius:50%;
  display:grid;
  place-items:center;
  opacity:0;
  transform:scale(.72);
  pointer-events:none;
  transition:opacity .22s ease, transform .32s cubic-bezier(.2,.85,.25,1.18);
}
.achievement-medal.show{
  opacity:1;
  transform:scale(1);
}
.achievement-medal.nature{
  background:linear-gradient(145deg,#e4f6e8,#bfe7c8);
  border:4px solid #65a979;
  box-shadow:0 12px 28px rgba(60,130,83,.22), inset 0 0 0 3px rgba(255,255,255,.65);
  color:#2d7550;
}
.achievement-medal.life{
  background:linear-gradient(145deg,#fff0df,#f4c692);
  border:4px solid #d88435;
  box-shadow:0 12px 28px rgba(185,108,42,.22), inset 0 0 0 3px rgba(255,255,255,.65);
  color:#a25a1f;
}
.achievement-medal.region{
  background:linear-gradient(145deg,#fff6be,#efc84f);
  border:4px solid #c99316;
  box-shadow:0 12px 30px rgba(167,124,15,.28), inset 0 0 0 3px rgba(255,255,255,.70);
  color:#805c0b;
}
.achievement-medal-inner{
  width:86px;
  height:86px;
  border-radius:50%;
  display:grid;
  grid-template-rows:34px auto auto;
  align-content:center;
  justify-items:center;
  text-align:center;
  background:rgba(255,255,255,.38);
}
.achievement-medal-icon{
  width:32px;
  height:32px;
  display:grid;
  place-items:center;
}
.achievement-medal-icon svg{
  width:36px;
  height:36px;
  display:block;
}
@media(max-width:700px){
  .achievement-medal{
    width:96px;
    height:96px;
    top:-18px;
    right:-20px;
  }
  .achievement-medal-inner{
    width:72px;
    height:72px;
    grid-template-rows:28px auto auto;
  }
  .achievement-medal-icon svg{width:30px;height:30px}
    }


/* --- v5.0 Drag Hint Box --- */
.hint-box{
  position:absolute;
  top:-47px;
  left:50%;
  z-index:20;
  width:min(66%,740px);
  min-height:80px;
  padding:12px 24px;
  transform:translate(-50%,-8px);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:1px solid rgba(92,126,139,.24);
  border-radius:15px;
  background:#fffdf8;
  box-shadow:0 8px 18px rgba(28,66,86,.10);
  color:#35586a;
  font-size:clamp(14px,1.6vw,19px);
  font-weight:800;
  line-height:1.35;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .14s ease,transform .14s ease,visibility 0s linear .14s;
}
.hint-box.show{
  opacity:1;
  visibility:visible;
  transform:translate(-50%,0);
  transition-delay:0s;
}
@media(max-width:700px){
  .hint-box{
    top:10px;
    width:min(64%,480px);
    min-height:40px;
    padding:7px 12px;
    font-size:clamp(11px,2vw,14px);
  }
}

</style>
</head>
<body>

  <header class="home-header">
    <div class="title-wrap">
      <h1>Geo Explorer</h1>
      <span class="version">v5.0</span>
    </div>
    <div class="home-copy">
      <strong>日本を旅しよう</strong>
      <span>地図をタッチして、行きたい地方へ</span>
    </div>

  }

</style>

<script>
const HOKKAIDO_ITEMS=[
  {id:"ishikari-plain",name:"石狩平野",category:"plain",icon:"assets/icons/plain.svg?v=250",x:38,y:54,side:"left"},

  {id:"lake-kussharo",name:"屈斜路湖",category:"lake",icon:"assets/icons/lake.svg?v=250",x:77,y:49,side:"right"}

const LEVELS=[
  {id:"hokkaido",name:"北海道",map:"assets/maps/hokkaido.svg?v=250",mapWidth:1000,mapHeight:700,displayScale:1.24,items:HOKKAIDO_ITEMS},
  {id:"tohoku",name:"東北",map:"assets/maps/tohoku.svg?v=250",mapWidth:760,mapHeight:1200,displayScale:1,items:typeof TOHOKU_ITEMS!=="undefined"?TOHOKU_ITEMS:[]},
  {id:"kanto",name:"関東",map:"assets/maps/kanto.svg?v=250",mapWidth:396.28,mapHeight:428.39,displayScale:1.08,items:typeof KANTO_ITEMS!=="undefined"?KANTO_ITEMS:[]},
  {id:"chubu",name:"中部",map:"assets/maps/chubu.svg?v=250",mapWidth:573.88,mapHeight:740.47,displayScale:1.05,items:typeof CHUBU_ITEMS!=="undefined"?CHUBU_ITEMS:[]},
  {id:"kinki",name:"近畿",map:"assets/maps/kinki.svg?v=250",mapWidth:458.42,mapHeight:428.93,displayScale:1.08,items:typeof KINKI_ITEMS!=="undefined"?KINKI_ITEMS:[]},
  {id:"chugoku",name:"中国",map:"assets/maps/chugoku.svg?v=250",mapWidth:539.55,mapHeight:380.15,displayScale:1.08,items:typeof CHUGOKU_ITEMS!=="undefined"?CHUGOKU_ITEMS:[]},
  {id:"shikoku",name:"四国",map:"assets/maps/shikoku.svg?v=250",mapWidth:425.16,mapHeight:337.08,displayScale:1.10,items:typeof SHIKOKU_ITEMS!=="undefined"?SHIKOKU_ITEMS:[]},
  {id:"kyushu",name:"九州・沖縄",map:"assets/maps/kyushu-okinawa.svg?v=451",mapWidth:661.55,mapHeight:650.00,displayScale:1.04,sets:{nature:typeof KYUSHU_NATURE_ITEMS!=="undefined"?KYUSHU_NATURE_ITEMS:[],life:typeof KYUSHU_LIFE_ITEMS!=="undefined"?KYUSHU_LIFE_ITEMS:[]}}
];

const state={
  levelIndex:0,
  items:[],
  placed:new Set(),
  completed:new Set(),
  levelProgress:new Map(),
  dragging:null,
  audio:null,
  raf:0,
  pointerX:0,
  pointerY:0,
  transitioning:false,
  layer:"nature"
};

const $=id=>document.getElementById(id);
const homeScreen=$("homeScreen");
const gameScreen=$("gameScreen");
const mapStage=$("mapStage");
const mapWrap=$("mapWrap");
const mapImage=$("mapImage");
const leftCards=$("leftCards");
const rightCards=$("rightCards");
const progress=$("progress");
const areaTitle=$("areaTitle");
const message=$("message");
const nextButton=$("nextButton");
const completionActions=$("completionActions");
const replayButton=$("replayButton");
const returnButton=$("returnButton");
const homeMessage=$("homeMessage");
const layerSwitch=$("layerSwitch");
const natureLayerButton=$("natureLayerButton");
const lifeLayerButton=$("lifeLayerButton");
const achievementMedal=$("achievementMedal");
const achievementMedalIcon=$("achievementMedalIcon");
const achievementMedalLabel=$("achievementMedalLabel");
const hintBox=$("hintBox");

function currentLevel(){return LEVELS[state.levelIndex]}

function currentProgressKey(){
  const level=currentLevel();
  return level.id==="kyushu" ? `${level.id}:${state.layer}` : level.id;
}

function currentItems(){
  const level=currentLevel();
  if(level.id==="kyushu" && level.sets){
    return level.sets[state.layer] || [];
  }
  return level.items || [];
}

function mapBuildMessage(){
  if(currentLevel().id==="kyushu"){
    return state.layer==="life"
      ? "「暮らし」の地図をつくろう"
      : "「自然」の地図をつくろう";
  }
  return "「自然」の地図をつくろう";
}

function updateLayerSwitch(){
  const isKyushu=currentLevel().id==="kyushu";
  layerSwitch.classList.toggle("show",isKyushu);
  natureLayerButton.classList.toggle("active",state.layer==="nature");
  lifeLayerButton.classList.toggle("active",state.layer==="life");
  refreshPersistentMedal();
}


function medalIcon(type){
  if(type==="nature"){
    return `<svg viewBox="0 0 48 48" aria-hidden="true">
      <path d="M36 9C24 10 14 16 12 29c8 3 19 0 24-20Z" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M13 33c7-8 13-12 22-17" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    </svg>`;
  }
  if(type==="life"){
    return `<svg viewBox="0 0 48 48" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="24" cy="9.5" rx="4.2" ry="8"/>
        <ellipse cx="24" cy="38.5" rx="4.2" ry="8"/>
        <ellipse cx="9.5" cy="24" rx="8" ry="4.2"/>
        <ellipse cx="38.5" cy="24" rx="8" ry="4.2"/>
        <ellipse cx="13.8" cy="13.8" rx="4.1" ry="7.4" transform="rotate(-45 13.8 13.8)"/>
        <ellipse cx="34.2" cy="13.8" rx="4.1" ry="7.4" transform="rotate(45 34.2 13.8)"/>
        <ellipse cx="13.8" cy="34.2" rx="4.1" ry="7.4" transform="rotate(45 13.8 34.2)"/>
        <ellipse cx="34.2" cy="34.2" rx="4.1" ry="7.4" transform="rotate(-45 34.2 34.2)"/>
        <circle cx="24" cy="24" r="8.2"/>
      </g>
    </svg>`;
  }
  return `<svg viewBox="0 0 48 48" aria-hidden="true">
    <path d="m24 6 5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1Z" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"/>
  </svg>`;
}

let medalPromoteTimer=0;

function hideAchievementMedal(){
  clearTimeout(medalPromoteTimer);
  achievementMedal.classList.remove("show");
}

function setAchievementMedal(type){
  achievementMedal.className=`achievement-medal ${type}`;
  achievementMedalIcon.innerHTML=medalIcon(type);
  achievementMedalLabel.textContent="できた！";
  requestAnimationFrame(()=>achievementMedal.classList.add("show"));
}

function medalStateForCurrentView(){
  if(currentLevel().id!=="kyushu")return null;

  const natureDone=state.completed.has("kyushu:nature");
  const lifeDone=state.completed.has("kyushu:life");

  if(state.layer==="nature"&&natureDone)return "nature";
  if(state.layer==="life"&&lifeDone)return "life";
  return null;
}

function refreshPersistentMedal(){
  clearTimeout(medalPromoteTimer);
  const type=medalStateForCurrentView();

  if(!type){
    achievementMedal.classList.remove("show");
    return;
  }

  setAchievementMedal(type);
}

function showAchievementMedal(type){
  clearTimeout(medalPromoteTimer);
  setAchievementMedal(type);
}


function showHint(item){
  if(!item?.hint){
    hideHint();
    return;
  }
  hintBox.textContent=item.hint;
  hintBox.classList.add("show");
}

function hideHint(){
  hintBox.classList.remove("show");
}

function switchLayer(nextLayer){
  if(currentLevel().id!=="kyushu" || state.layer===nextLayer)return;
  hideHint();
  if(state.dragging)cancelDrag();
  state.layer=nextLayer;
  updateLayerSwitch();
  loadLevel(state.levelIndex);
}

function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}

async function travelToGame(levelId){
  if(state.transitioning)return;
  const index=LEVELS.findIndex(v=>v.id===levelId);
  if(index<0)return;
  state.transitioning=true;

  homeScreen.classList.add("leaving");
  await wait(220);

  homeScreen.classList.remove("active","leaving");
  gameScreen.classList.add("active");
  document.body.style.touchAction="none";
  loadLevel(index);

  await wait(260);
  state.transitioning=false;
}

async function travelHome(){
  if(state.transitioning)return;
  hideHint();
  state.transitioning=true;
  if(state.dragging)cancelDrag();

  gameScreen.classList.add("leaving");
  await wait(220);

  gameScreen.classList.remove("active","leaving");
  homeScreen.classList.add("active");
  document.body.style.touchAction="manipulation";
  updateHome();

  await wait(260);
  state.transitioning=false;
}

function ensureStarLayer(){
  const svg=document.querySelector("#japanMap svg");
  if(!svg)return null;

  let defs=svg.querySelector("defs");
  if(!defs){
    defs=document.createElementNS("http://www.w3.org/2000/svg","defs");
    svg.insertBefore(defs,svg.firstChild);
  }

  if(!svg.querySelector("#completion-star-gold")){
    const gradient=document.createElementNS("http://www.w3.org/2000/svg","linearGradient");
    gradient.id="completion-star-gold";
    gradient.setAttribute("x1","0%");
    gradient.setAttribute("y1","0%");
    gradient.setAttribute("x2","0%");
    gradient.setAttribute("y2","100%");

    [["0%","#fff27a"],["48%","#ffc928"],["100%","#ee9d00"]].forEach(([offset,color])=>{
      const stop=document.createElementNS("http://www.w3.org/2000/svg","stop");
      stop.setAttribute("offset",offset);
      stop.setAttribute("stop-color",color);
      gradient.appendChild(stop);
    });
    defs.appendChild(gradient);
  }

  if(!svg.querySelector("#completion-star-glow")){
    const glow=document.createElementNS("http://www.w3.org/2000/svg","filter");
    glow.id="completion-star-glow";
    glow.setAttribute("x","-80%");
    glow.setAttribute("y","-80%");
    glow.setAttribute("width","260%");
    glow.setAttribute("height","260%");

    const blur=document.createElementNS("http://www.w3.org/2000/svg","feGaussianBlur");
    blur.setAttribute("stdDeviation","7");
    blur.setAttribute("result","blur");

    const flood=document.createElementNS("http://www.w3.org/2000/svg","feFlood");
    flood.setAttribute("flood-color","#ffd84e");
    flood.setAttribute("flood-opacity",".56");
    flood.setAttribute("result","glowColor");

    const composite=document.createElementNS("http://www.w3.org/2000/svg","feComposite");
    composite.setAttribute("in","glowColor");
    composite.setAttribute("in2","blur");
    composite.setAttribute("operator","in");
    composite.setAttribute("result","softGlow");

    const merge=document.createElementNS("http://www.w3.org/2000/svg","feMerge");
    const glowNode=document.createElementNS("http://www.w3.org/2000/svg","feMergeNode");
    glowNode.setAttribute("in","softGlow");
    const sourceNode=document.createElementNS("http://www.w3.org/2000/svg","feMergeNode");
    sourceNode.setAttribute("in","SourceGraphic");
    merge.append(glowNode,sourceNode);

    glow.append(blur,flood,composite,merge);
    defs.appendChild(glow);
  }

  let layer=svg.querySelector("#completion-stars");
  if(!layer){
    layer=document.createElementNS("http://www.w3.org/2000/svg","g");
    layer.id="completion-stars";
    layer.setAttribute("aria-hidden","true");
    svg.appendChild(layer);
  }
  return layer;
}

function addCompletionStar(regionId){
  const svg=document.querySelector("#japanMap svg");
  const region=svg?.querySelector(`#${regionId}`);
  const layer=ensureStarLayer();
  if(!region||!layer)return;

  const box=region.getBBox();
  const cx=box.x+box.width/2;
  const cy=box.y+box.height/2;

  const badge=document.createElementNS("http://www.w3.org/2000/svg","g");
  badge.dataset.region=regionId;
  badge.setAttribute("aria-hidden","true");
  badge.setAttribute("transform",`translate(${cx} ${cy})`);

  const outer=document.createElementNS("http://www.w3.org/2000/svg","circle");
  outer.setAttribute("r","80");
  outer.setAttribute("class","completion-medal");

  const inner=document.createElementNS("http://www.w3.org/2000/svg","circle");
  inner.setAttribute("r","68");
  inner.setAttribute("class","completion-medal-inner");

  const star=document.createElementNS("http://www.w3.org/2000/svg","path");
  star.setAttribute("class","completion-medal-star");
  star.setAttribute("d","M0,-10 L2.9,-3.2 L10,-3.1 L4.3,1.2 L6.2,8 L0,4.1 L-6.2,8 L-4.3,1.2 L-10,-3.1 L-2.9,-3.2 Z");
  star.setAttribute("transform","scale(4.2)");

  badge.append(outer,inner,star);
  layer.appendChild(badge);
}

function updateHome(){
  const layer=ensureStarLayer();
  if(layer)layer.replaceChildren();

  const completedRegions=new Set(
    [...state.completed].filter(key=>!key.includes(":"))
  );

  if(
    state.completed.has("kyushu:nature") &&
    state.completed.has("kyushu:life")
  ){
    completedRegions.add("kyushu");
  }

  completedRegions.forEach(addCompletionStar);
  homeMessage.textContent=completedRegions.size
    ? `${completedRegions.size}つの地方を完成！ 次はどこへ行こう？`
    : "行きたい場所を選ぼう";
}

function prepareHomeRegions(){
  document.querySelectorAll("#japanMap svg .region").forEach(region=>{
    region.removeAttribute("role");
    region.removeAttribute("tabindex");
    region.removeAttribute("aria-label");
  });
}

function activateRegion(regionId){
  const region=document.querySelector(`#japanMap svg #${regionId}`);
  if(!region)return;

  region.setAttribute("role","button");
  region.setAttribute("tabindex","0");
  region.setAttribute("aria-label",`${LEVELS.find(v=>v.id===regionId)?.name||regionId}へ行く`);
  region.addEventListener("click",()=>travelToGame(regionId));
  region.addEventListener("keydown",event=>{
    if(event.key==="Enter"||event.key===" "){
      event.preventDefault();
      travelToGame(regionId);
    }
  });
}

prepareHomeRegions();
activateRegion("hokkaido");
activateRegion("tohoku");
activateRegion("kanto");
activateRegion("chubu");
activateRegion("kinki");
activateRegion("chugoku");
activateRegion("shikoku");
activateRegion("kyushu");
$("homeButton").addEventListener("click",travelHome);
returnButton.addEventListener("click",travelHome);
replayButton.addEventListener("click",replayCurrentLevel);

function initAudio(){
  if(!state.audio)state.audio=new(window.AudioContext||window.webkitAudioContext)();
  if(state.audio.state==="suspended")state.audio.resume();
}
function tone(f,d=.1,type="sine",g=.035,delay=0){
  initAudio();
  const t=state.audio.currentTime+delay;
  const o=state.audio.createOscillator();
  const a=state.audio.createGain();
  o.type=type;
  o.frequency.setValueAtTime(f,t);
  a.gain.setValueAtTime(g,t);
  a.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(a);
  a.connect(state.audio.destination);
  o.start(t);
  o.stop(t+d);
}
const pickup=()=>{tone(430,.07,"sine",.025);tone(610,.08,"sine",.022,.045)};
const correct=()=>{tone(590,.10);tone(790,.13,"sine",.035,.08)};
const closeSound=()=>{tone(660,.07,"triangle",.025);tone(760,.08,"triangle",.022,.065)};
const clearSound=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,"sine",.04,i*.09));

function fitMap(){
  if(!gameScreen.classList.contains("active"))return;
  const level=currentLevel();
  const rect=mapStage.getBoundingClientRect();
  const ratio=level.mapWidth/level.mapHeight;
  let width=rect.width;
  let height=width/ratio;
  if(height>rect.height){
    height=rect.height;
    width=height*ratio;
  }
  width*=level.displayScale||1;
  height*=level.displayScale||1;
  mapWrap.style.width=`${Math.floor(width)}px`;
  mapWrap.style.height=`${Math.floor(height)}px`;
}

function clearLevelDom(){
  leftCards.replaceChildren();
  rightCards.replaceChildren();
  [...mapWrap.querySelectorAll(".drop-zone")].forEach(node=>node.remove());
}


/* =========================================================
   Geo Explorer v4.7 — 10-question layout TEST
   ---------------------------------------------------------
   Purpose:
   - Keep all existing real 6 questions unchanged.
   - Add 4 temporary questions at runtime only.
   - Result: left 5 / right 5 for UI and drag testing.
   - Remove this block once each *-items.js contains
     10 real questions.
   ========================================================= */
const TEN_ITEM_LAYOUT_TEST = false;

function expandToTenForLayoutTest(sourceItems){
  const items = sourceItems.map(item => ({...item}));
  if(!TEN_ITEM_LAYOUT_TEST || items.length !== 6) return items;

  const leftBase  = items.filter(item => item.side === "left");
  const rightBase = items.filter(item => item.side === "right");

  const L1 = leftBase[0]  || items[0];
  const L2 = leftBase[1]  || items[1] || items[0];
  const R1 = rightBase[0] || items[3] || items[0];
  const R2 = rightBase[1] || items[4] || items[0];

  const clamp = v => Math.max(7, Math.min(93, v));

  return items.concat([
    {
      ...L1,
      id:`${L1.id}-layout-test-7`,
      name:"追加山地",
      side:"left",
      x:clamp(Number(L1.x) + 7),
      y:clamp(Number(L1.y) - 7),
      __layoutTest:true
    },
    {
      ...L2,
      id:`${L2.id}-layout-test-8`,
      name:"追加平野",
      side:"left",
      x:clamp(Number(L2.x) - 7),
      y:clamp(Number(L2.y) + 7),
      __layoutTest:true
    },
    {
      ...R1,
      id:`${R1.id}-layout-test-9`,
      name:"追加河川",
      side:"right",
      x:clamp(Number(R1.x) - 7),
      y:clamp(Number(R1.y) - 7),
      __layoutTest:true
    },
    {
      ...R2,
      id:`${R2.id}-layout-test-10`,
      name:"追加地形",
      side:"right",
      x:clamp(Number(R2.x) + 7),
      y:clamp(Number(R2.y) + 7),
      __layoutTest:true
    }
  ]);
}

function loadLevel(index){
  hideHint();
  achievementMedal.classList.remove("show");
  state.levelIndex=index;
  const level=currentLevel();
  const sourceItems=currentItems();
  state.items=sourceItems.map(item=>({
    ...item,
    icon:item.icon.includes("?")?item.icon:`${item.icon}?v=420`
  }));
  const saved=state.levelProgress.get(currentProgressKey());
  state.placed=new Set(saved ? saved : []);
  clearLevelDom();

  areaTitle.textContent=level.name;
  updateLayerSwitch();
  mapImage.src=level.map;
  mapImage.alt=`${level.name}の地図`;
  message.style.display="";
  message.textContent=mapBuildMessage();
  completionActions.classList.remove("show");

  mapStage.classList.add("switching");
  fitMap();
  build();
  restorePlacedItems();

  if(state.placed.size===state.items.length&&state.items.length){
    showCompletedState(false);
  }

  requestAnimationFrame(()=>{
    fitMap();
    mapStage.classList.remove("switching");
  });
}

function build(){
  if(!state.items.length){
    message.textContent="カードを読み込めませんでした。";
    progress.textContent="0 / 0";
    return;
  }

  state.items.forEach(item=>{
    const zone=document.createElement("div");
    zone.className="drop-zone";
    zone.dataset.id=item.id;
    zone.style.left=item.x+"%";
    zone.style.top=item.y+"%";
    zone.setAttribute("aria-label",`${item.name}の配置場所`);
    mapWrap.appendChild(zone);

    const card=document.createElement("div");
    card.className=`card category-${item.category}`;
    card.dataset.id=item.id;
    card.innerHTML=`<span class="card-icon"><img src="${item.icon}" alt=""></span><span class="card-name">${item.name}</span>`;
    card.addEventListener("pointerdown",startDrag);
    if(state.placed.has(item.id))card.classList.add("done");
    (item.side==="left"?leftCards:rightCards).appendChild(card);
  });

  update();
}

function restorePlacedItems(){
  state.items.forEach(item=>{
    if(!state.placed.has(item.id))return;
    const zone=mapWrap.querySelector(`.drop-zone[data-id="${item.id}"]`);
    if(!zone)return;
    zone.classList.add("filled");
    zone.innerHTML=`<div class="placed"><img src="${item.icon}" alt=""><span>${item.name}</span></div>`;
  });
  update();
}

function startDrag(e){
  const card=e.currentTarget;
  const item=state.items.find(value=>value.id===card.dataset.id);
  if(!item||state.placed.has(item.id))return;

  e.preventDefault();
  showHint(item);
  pickup();

  const ghost=card.cloneNode(true);
  ghost.classList.add("drag-ghost");
  ghost.style.left=e.clientX+"px";
  ghost.style.top=e.clientY+"px";
  document.body.appendChild(ghost);

  card.classList.add("lifted");
  state.pointerX=e.clientX;
  state.pointerY=e.clientY;
  state.dragging={item,card,ghost};

  window.addEventListener("pointermove",move,{passive:false});
  window.addEventListener("pointerup",end,{once:true});
  window.addEventListener("pointercancel",end,{once:true});
}

function move(e){
  if(!state.dragging)return;
  e.preventDefault();
  state.pointerX=e.clientX;
  state.pointerY=e.clientY;

  if(state.raf)return;
  state.raf=requestAnimationFrame(()=>{
    state.raf=0;
    if(!state.dragging)return;

    state.dragging.ghost.style.left=state.pointerX+"px";
    state.dragging.ghost.style.top=state.pointerY+"px";
    document.querySelectorAll(".drop-zone").forEach(zone=>zone.classList.remove("hot"));

    const target=zoneAt(state.pointerX,state.pointerY);
    if(target)target.classList.add("hot");
  });
}

function zoneAt(x,y){
  return [...document.querySelectorAll(".drop-zone:not(.filled)")].find(zone=>{
    const rect=zone.getBoundingClientRect();
    const margin=18;
    return x>=rect.left-margin&&x<=rect.right+margin&&y>=rect.top-margin&&y<=rect.bottom+margin;
  });
}

function end(e){
  if(!state.dragging)return;

  hideHint();
  const {item,card,ghost}=state.dragging;
  const hit=zoneAt(e.clientX,e.clientY);

  document.querySelectorAll(".drop-zone").forEach(zone=>zone.classList.remove("hot"));
  ghost.remove();
  card.classList.remove("lifted");

  if(hit&&hit.dataset.id===item.id){
    place(item,card,hit);
  }else if(hit){
    hit.classList.add("close");
    setTimeout(()=>hit.classList.remove("close"),420);
    message.textContent="おしい！";
    closeSound();
  }else{
    message.textContent=mapBuildMessage();
  }

  state.dragging=null;
  if(state.raf){
    cancelAnimationFrame(state.raf);
    state.raf=0;
  }
  window.removeEventListener("pointermove",move);
}

function cancelDrag(){
  hideHint();
  if(!state.dragging)return;
  state.dragging.ghost.remove();
  state.dragging.card.classList.remove("lifted");
  state.dragging=null;
  window.removeEventListener("pointermove",move);
}

function place(item,card,zone){
  state.placed.add(item.id);
  state.levelProgress.set(currentProgressKey(),new Set(state.placed));
  zone.classList.add("filled");
  zone.innerHTML=`<div class="placed"><img src="${item.icon}" alt=""><span>${item.name}</span></div>`;
  card.classList.add("done");
  correct();
  message.textContent="ぴったり！";
  update();

  if(state.placed.size===state.items.length)complete();
}

function update(){
  progress.textContent=`${state.placed.size} / ${state.items.length}`;
}

function showCompletedState(playSound=true){
  if(playSound)clearSound();
  state.completed.add(currentProgressKey());
  state.levelProgress.set(
    currentProgressKey(),
    new Set(state.items.map(item=>item.id))
  );
  message.style.display="none";
  completionActions.classList.add("show");
  updateLayerSwitch();
}

function complete(){
  showCompletedState(true);

  if(currentLevel().id==="kyushu"){
    const currentType=state.layer==="nature" ? "nature" : "life";
    achievementMedal.classList.remove("show");
    setTimeout(()=>showAchievementMedal(currentType),80);
  }
}

function replayCurrentLevel(){
  const key=currentProgressKey();
  state.levelProgress.set(key,new Set());
  state.completed.delete(key);
  state.placed=new Set();
  updateLayerSwitch();
  loadLevel(state.levelIndex);
}

natureLayerButton.addEventListener("click",()=>switchLayer("nature"));
lifeLayerButton.addEventListener("click",()=>switchLayer("life"));

window.addEventListener("resize",fitMap);
if("ResizeObserver"in window)new ResizeObserver(fitMap).observe(mapStage);
updateHome();
</script>
