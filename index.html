<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Geo Explorer v0.2.2</title>
<style>
:root{
  --ink:#17324d;--sub:#62788c;--good:#2ecc71;--warn:#f6b73c;
  --bg1:#eaf7ff;--bg2:#fff8e8;--panel:rgba(255,255,255,.92);
  --mountain:#dff5e7;--mountain-border:#58b982;
  --range:#efe5ff;--range-border:#9470c8;
  --river:#dff3ff;--river-border:#4aa8dc;
  --shadow:0 12px 28px rgba(36,73,105,.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--ink)}
body{background:radial-gradient(circle at 12% 10%,rgba(255,255,255,.95),transparent 30%),linear-gradient(145deg,var(--bg1),var(--bg2))}
button{font:inherit}
.app{height:100dvh;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.screen{display:none;height:100%}.screen.active{display:flex}.center{align-items:center;justify-content:center}
.hero{width:min(760px,94vw);padding:clamp(28px,5vw,54px);text-align:center;background:var(--panel);border:2px solid #fff;border-radius:28px;box-shadow:var(--shadow)}
.logo{font-size:64px}.hero h1{margin:4px 0;font-size:clamp(32px,5vw,54px)}.hero p{color:var(--sub);font-size:19px}
.primary,.secondary{border:0;border-radius:17px;padding:14px 26px;font-weight:900;cursor:pointer}
.primary{background:linear-gradient(135deg,#ff9f43,#ffbf69);color:#fff;box-shadow:0 7px 0 #d87924;font-size:19px}
.secondary{background:#fff;border:2px solid #c7d9e7;color:var(--ink);font-size:16px}
.note{margin-top:18px;color:var(--sub);font-size:13px}

#game{flex-direction:column;gap:7px;min-height:0}
.topbar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;max-width:1180px;margin:0 auto}
.tools{display:flex;gap:7px;align-items:center}.icon,.tool,.score{background:#fff;border:0;border-radius:13px;box-shadow:0 5px 14px rgba(36,73,105,.11)}
.icon{width:42px;height:42px;font-size:21px}.tool{padding:9px 11px;font-size:13px;font-weight:900}.tool.active{outline:2px solid #6bc5ee;background:#e7f7ff}
.score{padding:10px 13px;font-weight:950;white-space:nowrap}.title{text-align:center}.title strong{display:block;font-size:clamp(20px,2.6vw,29px);line-height:1}.title span{font-size:12px;color:var(--sub)}
.progress{height:9px;width:min(690px,70vw);margin:0 auto;border-radius:99px;background:rgba(255,255,255,.76);overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#4bb3fd,var(--good));transition:.35s}

.layout{width:min(1180px,100%);margin:0 auto;flex:1;min-height:0;display:grid;grid-template-columns:190px minmax(430px,1fr) 190px;grid-template-areas:"left map right";gap:10px 0;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;min-height:0}
#left{grid-area:left;transform:translateX(30px)}#right{grid-area:right;transform:translateX(-30px)}
#bottom{display:none}
.layout.bottom{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"map" "bottom";gap:8px}
.layout.bottom #left,.layout.bottom #right{display:none}.layout.bottom #bottom{grid-area:bottom;display:flex;flex-direction:row;gap:16px;justify-content:center}

.map{grid-area:map;position:relative;width:100%;height:100%;min-height:0;border-radius:26px;border:3px solid #fff;background:radial-gradient(circle at 50% 40%,#fff,rgba(255,255,255,.76));box-shadow:var(--shadow);overflow:hidden;touch-action:none}
.map-label{position:absolute;left:14px;top:11px;z-index:3;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.9);font-size:12px;color:var(--sub);font-weight:900}
svg{position:absolute;inset:2.5% 3%;width:94%;height:95%}
.land{fill:#f1e6ce;stroke:#9d7a50;stroke-width:5;filter:drop-shadow(0 7px 6px rgba(65,53,37,.13))}
.ridge{fill:none;stroke:#d7c29f;stroke-width:3;stroke-dasharray:7 8}
.target{position:absolute;width:104px;height:72px;transform:translate(-50%,-50%);border:3px dashed rgba(23,50,77,.42);border-radius:20px;background:rgba(255,255,255,.54);transition:.18s;z-index:2}
.target.hover{transform:translate(-50%,-50%) scale(1.10);border-color:#4bb3fd;background:rgba(75,179,253,.2);box-shadow:0 0 0 7px rgba(75,179,253,.1)}
.target.correct{display:flex;align-items:center;justify-content:center;text-align:center;border-style:solid;border-color:var(--good);background:#e8fff0;color:#168a46;font-weight:950;white-space:pre-line;line-height:1.18}
.target.correct::after{content:"✓\A" attr(data-label)}
.target.wrong{animation:wiggle .34s ease;border-color:var(--warn)}
@keyframes wiggle{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(-50%,-50%) rotate(-3deg)}75%{transform:translate(-50%,-50%) rotate(3deg)}}

.card{width:148px;min-height:100px;border-radius:20px;border:3px solid;padding:12px 10px;font-size:20px;font-weight:950;line-height:1.15;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 8px 0 rgba(74,112,140,.2),0 14px 22px rgba(36,73,105,.13);touch-action:none;user-select:none;cursor:grab;position:relative}
.card::before{content:"≡";position:absolute;right:10px;top:6px;font-size:12px;color:#94adbf}
.card[data-type="山地"]{background:var(--mountain);border-color:var(--mountain-border)}
.card[data-type="山脈"]{background:var(--range);border-color:var(--range-border)}
.card[data-type="河川"]{background:var(--river);border-color:var(--river-border)}
.card.dragging{position:fixed!important;z-index:9999!important;pointer-events:none;transform:scale(1.08) rotate(-1.5deg);box-shadow:0 18px 34px rgba(36,73,105,.28);opacity:.97}
.layout.bottom .card{width:220px;min-height:76px}

.feedback{position:fixed;left:50%;top:16%;transform:translate(-50%,-50%) scale(.7);padding:10px 19px;border-radius:999px;background:#fff;font-weight:950;font-size:20px;box-shadow:var(--shadow);opacity:0;pointer-events:none;z-index:10000}
.feedback.show{animation:pop .65s}.feedback.good{color:#168a46}.feedback.warn{color:#b57910}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.65)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(.96)}}

.clear-icon{font-size:90px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
@media(max-width:900px) and (orientation:landscape){.layout{grid-template-columns:155px minmax(390px,1fr) 155px}.card{width:126px;min-height:84px;font-size:18px}#left{transform:translateX(24px)}#right{transform:translateX(-24px)}}
@media(orientation:portrait){html,body{overflow:auto}.app{height:auto;min-height:100dvh}.screen{height:auto;min-height:100dvh}.layout,.layout.bottom{grid-template-columns:1fr 1fr;grid-template-areas:"map map" "left right" "bottom bottom"}.map{min-height:430px}.stack{flex-direction:row;flex-wrap:wrap}#left,#right{transform:none}.layout.bottom #left,.layout.bottom #right{display:flex}.layout.bottom #bottom{display:flex;flex-wrap:wrap}.card,.layout.bottom .card{width:min(42vw,180px);min-height:82px}}
</style>
</head>
<body>
<div class="app">
<section id="home" class="screen center active">
  <div class="hero"><div class="logo">🧭</div><h1>Geo Explorer</h1><p>ドラッグして、世界を組み立てよう。</p><button id="start" class="primary">北海道へ出発</button><div class="note">v0.2.2｜Level 1</div></div>
</section>

<section id="game" class="screen">
  <header class="topbar">
    <div class="tools"><button id="homeBtn" class="icon">⌂</button><button id="layoutBtn" class="tool">配置：左右</button></div>
    <div class="title"><strong>北海道の3つの山地</strong><span>正しい場所へドラッグ。置く順番は自由です。</span></div>
    <div class="tools"><button id="soundBtn" class="tool active">🔊 音あり</button><div id="score" class="score">0 / 3</div></div>
  </header>
  <div class="progress"><div id="bar" class="bar"></div></div>

  <main id="layout" class="layout">
    <div id="left" class="stack"></div>
    <section class="map">
      <div class="map-label">北海道</div>
      <svg viewBox="0 0 900 570" aria-label="北海道の簡略地図">
        <!-- 渡島・積丹・知床・根室など主要な半島を意識した輪郭 -->
        <path class="land" d="M70 325
          C91 298 116 282 144 273
          C169 251 194 230 226 222
          C254 184 286 155 330 138
          C365 125 397 92 432 74
          C469 55 500 68 529 91
          L565 112
          C601 95 638 72 679 67
          C713 63 738 77 747 103
          C755 126 749 151 735 174
          C759 173 786 177 812 191
          C833 202 843 219 832 233
          C820 248 791 252 762 252
          C779 272 795 297 802 326
          C807 346 795 359 773 357
          C751 355 729 347 707 350
          C684 354 665 368 648 385
          C626 408 603 433 575 446
          C548 458 520 453 492 441
          C468 431 447 418 423 421
          C397 425 371 446 346 459
          C321 472 296 481 271 476
          C247 471 229 457 218 438
          C194 446 171 444 153 433
          C131 420 119 398 120 373
          C96 361 78 346 70 325 Z
          M218 438
          C231 461 253 481 278 501
          C297 516 309 536 300 550
          C289 565 263 557 244 539
          C224 520 205 493 190 467
          C181 451 190 441 218 438 Z
          M747 103
          C766 86 786 75 804 78
          C817 81 822 93 817 105
          C810 119 788 129 761 133 Z"/>
        <path class="ridge" d="M290 180 C344 228 369 289 373 370"/>
        <path class="ridge" d="M525 165 C486 226 468 298 474 382"/>
        <path class="ridge" d="M674 155 C697 213 698 274 699 329"/>
      </svg>
      <div class="target" data-target="kitami" style="left:72%;top:31%"></div>
      <div class="target" data-target="ishikari" style="left:52%;top:43%"></div>
      <div class="target" data-target="hidaka" style="left:55%;top:70%"></div>
    </section>
    <div id="right" class="stack"></div>
    <div id="bottom" class="stack"></div>
  </main>
</section>

<section id="clear" class="screen center">
  <div class="hero"><div class="clear-icon">🏔️✨</div><h1>一面クリア！</h1><p>北海道の地図が完成しました。</p><div id="stats" style="font-weight:900;margin:18px 0 26px"></div><div class="actions"><button id="retry" class="primary">もう一度</button><button id="clearHome" class="secondary">ホーム</button></div></div>
</section>
</div>
<div id="feedback" class="feedback"></div>

<script>
(()=>{
"use strict";
const DATA=[
  {id:"kitami",label:"北見\\n山地",type:"山地"},
  {id:"ishikari",label:"石狩\\n山地",type:"山地"},
  {id:"hidaka",label:"日高\\n山脈",type:"山脈"}
];
const $=id=>document.getElementById(id);
const screens={home:$("home"),game:$("game"),clear:$("clear")};
let placed=0,mistakes=0,drag=null,soundOn=true,layoutMode="side",ctx=null;

function show(name){Object.values(screens).forEach(s=>s.classList.remove("active"));screens[name].classList.add("active")}
function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume()}
function tone(freq,start,dur,type="sine",vol=.045){
  if(!soundOn)return;audio();
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,ctx.currentTime+start);
  g.gain.setValueAtTime(.0001,ctx.currentTime+start);
  g.gain.exponentialRampToValueAtTime(vol,ctx.currentTime+start+.01);
  g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+start+dur);
  o.connect(g).connect(ctx.destination);o.start(ctx.currentTime+start);o.stop(ctx.currentTime+start+dur+.02)
}
const pickup=()=>tone(430,0,.06,"triangle",.022);
const correct=()=>{tone(659,0,.12,"sine",.05);tone(880,.11,.18,"sine",.06)};
const close=()=>{tone(784,0,.09,"sine",.038);tone(988,.08,.11,"triangle",.036);tone(1175,.17,.14,"sine",.03)};
const clearSound=()=>{[523,659,784,1046,1318].forEach((f,i)=>tone(f,i*.1,.23,"sine",.048))};

function card(item){
  const b=document.createElement("button");b.className="card";b.dataset.id=item.id;b.dataset.type=item.type;b.dataset.label=item.label;b.innerHTML=item.label.replace("\\n","<br>");b.addEventListener("pointerdown",begin);return b
}
function distribute(){
  ["left","right","bottom"].forEach(id=>$(id).innerHTML="");
  const cs=DATA.map(card);
  if(layoutMode==="bottom")cs.forEach(c=>$("bottom").appendChild(c));
  else{$("left").appendChild(cs[0]);$("right").appendChild(cs[1]);$("right").appendChild(cs[2])}
}
function reset(){
  placed=0;mistakes=0;
  document.querySelectorAll(".target").forEach(t=>{t.className="target";t.removeAttribute("data-label")});
  distribute();update()
}
function start(){audio();reset();show("game")}
function update(){$("score").textContent=`${placed} / ${DATA.length}`;$("bar").style.width=`${placed/DATA.length*100}%`}
function toggleLayout(){layoutMode=layoutMode==="side"?"bottom":"side";$("layout").classList.toggle("bottom",layoutMode==="bottom");$("layoutBtn").textContent=layoutMode==="side"?"配置：左右":"配置：下";reset()}
function toggleSound(){soundOn=!soundOn;$("soundBtn").classList.toggle("active",soundOn);$("soundBtn").textContent=soundOn?"🔊 音あり":"🔇 音なし";if(soundOn)pickup()}

function begin(e){
  if(e.button!==undefined&&e.button!==0)return;e.preventDefault();pickup();
  const c=e.currentTarget,r=c.getBoundingClientRect();
  drag={c,id:e.pointerId,ox:e.clientX-r.left,oy:e.clientY-r.top,parent:c.parentElement,next:c.nextSibling};
  Object.assign(c.style,{width:r.width+"px",height:r.height+"px",left:r.left+"px",top:r.top+"px"});
  c.classList.add("dragging");document.body.appendChild(c);
  try{c.setPointerCapture(e.pointerId)}catch{}
  move(e);c.addEventListener("pointermove",move);c.addEventListener("pointerup",end);c.addEventListener("pointercancel",cancel)
}
function move(e){
  if(!drag||e.pointerId!==drag.id)return;
  drag.c.style.left=e.clientX-drag.ox+"px";drag.c.style.top=e.clientY-drag.oy+"px";
  document.querySelectorAll(".target.hover").forEach(t=>t.classList.remove("hover"));
  drag.c.style.visibility="hidden";const el=document.elementFromPoint(e.clientX,e.clientY);drag.c.style.visibility="visible";
  const t=el?.closest?.(".target");if(t&&!t.classList.contains("correct"))t.classList.add("hover")
}
function end(e){
  if(!drag||e.pointerId!==drag.id)return;
  const c=drag.c;c.style.visibility="hidden";const el=document.elementFromPoint(e.clientX,e.clientY);c.style.visibility="visible";const t=el?.closest?.(".target");
  cleanup(c);document.querySelectorAll(".target.hover").forEach(x=>x.classList.remove("hover"));
  if(t&&!t.classList.contains("correct")&&t.dataset.target===c.dataset.id)place(c,t);
  else{mistakes++;if(t){t.classList.add("wrong");setTimeout(()=>t.classList.remove("wrong"),380)}close();flash("おしい！",false);back(c)}
}
function cancel(){if(!drag)return;cleanup(drag.c);back(drag.c)}
function cleanup(c){c.removeEventListener("pointermove",move);c.removeEventListener("pointerup",end);c.removeEventListener("pointercancel",cancel);try{c.releasePointerCapture(drag.id)}catch{}}
function place(c,t){
  t.dataset.label=c.dataset.label;t.classList.add("correct");
  const r=t.getBoundingClientRect();c.style.transition="left .22s,top .22s,transform .22s,opacity .22s";c.style.left=r.left+(r.width-c.offsetWidth)/2+"px";c.style.top=r.top+(r.height-c.offsetHeight)/2+"px";c.style.transform="scale(.78)";
  placed++;update();correct();flash("正解！",true);
  setTimeout(()=>{c.remove();drag=null;if(placed===DATA.length)setTimeout(()=>{clearSound();$("stats").textContent=mistakes===0?"パーフェクト！ まちがい 0回":`クリア！ まちがい ${mistakes}回`;show("clear")},620)},230)
}
function back(c){
  const d=drag;if(d.next&&d.next.parentElement===d.parent)d.parent.insertBefore(c,d.next);else d.parent.appendChild(c);
  c.classList.remove("dragging");c.removeAttribute("style");c.animate([{transform:"scale(1.04)"},{transform:"scale(.96)"},{transform:"scale(1)"}],{duration:230,easing:"ease-out"});drag=null
}
function flash(text,good){const f=$("feedback");f.textContent=text;f.className="feedback "+(good?"good":"warn");void f.offsetWidth;f.classList.add("show")}

$("start").onclick=start;$("retry").onclick=start;$("homeBtn").onclick=()=>show("home");$("clearHome").onclick=()=>show("home");$("layoutBtn").onclick=toggleLayout;$("soundBtn").onclick=toggleSound;
window.addEventListener("contextmenu",e=>{if(e.target.closest(".card"))e.preventDefault()});
})();
</script>
</body>
</html>
