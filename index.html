<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#cfe8ee">
<title>Geo Explorer v7.4</title>
<style>
:root{
  --ink:#18364b;
  --muted:#6b8190;
  --panel:#fffdf8;
  --line:#d7e4e6;
  --accent:#267b63;
  --shadow:0 10px 24px rgba(28,66,86,.13);
  --journey:420ms;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  color:var(--ink);
  background:linear-gradient(180deg,#e7f5f7,#f6fbf8);
  -webkit-user-select:none;
  user-select:none;
}
button{font:inherit}
.screen{
  position:absolute;
  inset:0;
  display:grid;
  visibility:hidden;
  opacity:0;
  transform:scale(.985);
  pointer-events:none;
  transition:
    opacity var(--journey) ease,
    transform var(--journey) cubic-bezier(.2,.75,.25,1),
    visibility 0s linear var(--journey);
}
.screen.active{
  visibility:visible;
  opacity:1;
  transform:scale(1);
  pointer-events:auto;
  transition-delay:0s;
}
.screen.leaving{
  opacity:0;
  transform:scale(1.025);
  pointer-events:none;
}

/* HOME */
#homeScreen{
  grid-template-rows:auto 1fr auto;
  gap:8px;
  padding:10px 12px;
  touch-action:manipulation;
}
.home-header{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  min-height:44px;
}
.title-wrap{display:flex;align-items:baseline;gap:10px}
h1{font-size:clamp(20px,2.5vw,30px);margin:0}
.version{font-size:12px;color:var(--muted);font-weight:700}
.home-copy{text-align:right}
.home-copy strong{display:block;font-size:clamp(14px,1.8vw,20px)}
.home-copy span{font-size:12px;color:var(--muted);font-weight:700}
.home-main{min-height:0;display:flex;align-items:center;justify-content:center}
.japan-panel{
  position:relative;
  height:100%;
  max-height:760px;
  aspect-ratio:620/760;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.japan-map{
  position:absolute;
  inset:4.5%;
  width:91%;
  height:91%;
  display:grid;
  place-items:center;
}
.japan-map svg{
  display:block;
  width:100%;
  height:100%;
  overflow:visible;
  transform-box:fill-box;
  transform-origin:center;
  transform:translateY(-1.8%) rotate(5deg) scale(.965);
}
.japan-map .region{
  cursor:default;
  transform-box:fill-box;
  transform-origin:center;
  transition:transform .17s ease,filter .17s ease,opacity .17s ease;
}
.japan-map #hokkaido,
.japan-map #tohoku{
  cursor:pointer;
}
.japan-map #hokkaido:hover,
.japan-map #hokkaido:focus,
.japan-map #tohoku:hover,
.japan-map #tohoku:focus{
  filter:brightness(1.055) saturate(1.08);
  transform:scale(1.018);
}
.japan-map #hokkaido:active,
.japan-map #tohoku:active{
  transform:scale(.985);
  opacity:.88;
}
.completion-medal{
  fill:#fff2b8;
  stroke:#c99316;
  stroke-width:6;
  paint-order:stroke fill;
  pointer-events:none;
  filter:url(#completion-star-glow);
}
.completion-medal-inner{
  fill:none;
  stroke:#e5bd43;
  stroke-width:3;
  pointer-events:none;
}
.completion-medal-star{
  fill:#c99316;
  stroke:none;
  pointer-events:none;
}
.home-footer{
  text-align:center;
  min-height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  color:#496b7a;
}

/* Geo Explorer next UI:
   - 10-card capacity: 5 left / 5 right (item side remains data-driven)
   - compact card height/gap
   - hint/drop zone: 38 x 38px, 2px dashed, slightly darker
   - map sizing/viewBox unchanged
*/
/* GAME */
#gameScreen{
  grid-template-rows:auto 1fr auto;
  gap:8px;
  padding:10px 12px;
  touch-action:none;
}
.game-header{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  min-height:44px;
}
.game-title{
  display:flex;
  align-items:center;
  gap:9px;
  justify-self:start;
}
.home-button{
  border:1px solid var(--line);
  border-radius:999px;
  background:#ffffffc7;
  color:#476575;
  font-weight:900;
  padding:7px 12px;
  transition:transform .15s ease,background .15s ease;
}
.home-button:active{transform:scale(.96);background:#fff}
.status-wrap{
  display:flex;
  align-items:center;
  gap:8px;
  justify-self:end;
}
.reset-button{
  border:1px solid var(--line);
  border-radius:999px;
  background:#ffffffc7;
  color:#476575;
  font-weight:900;
  padding:7px 12px;
  transition:transform .15s ease,background .15s ease;
}
.reset-button[hidden]{display:none}
.reset-button:active{transform:scale(.96);background:#fff}
.reset-button.confirm{
  background:#ffe1b8;
  border-color:#e0a24a;
  color:#8a4b06;
}
.progress{
  text-align:center;
  background:#ffffffc7;
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 12px;
  font-weight:800;
  min-width:92px;
}
.game{
  min-height:0;
  display:grid;
  grid-template-columns:minmax(150px,22vw) minmax(0,1fr) minmax(150px,22vw);
  gap:10px;
}
.card-column{
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:9px;
  justify-content:center;
  width:82%;
}

/* Narrower card columns, kept close to the map.
   The freed space stays on the outside edges. */
.game > .card-column:first-child{
  justify-self:end;
}
.game > .card-column:last-child{
  justify-self:start;
}
.map-panel{
  position:relative;
  min-width:0;
  min-height:0;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:var(--shadow);
  overflow:visible;
}
.area-title{
  justify-self:center;
  font-size:clamp(26px,3.2vw,40px);
  font-weight:900;
  letter-spacing:.05em;
  color:var(--ink);
  white-space:nowrap;
  line-height:1;
}
.completion-actions{
  display:none;
  align-items:center;
  justify-content:center;
  gap:12px;
}
.completion-actions.show{display:flex}
.replay-button,.return-button{
  border-radius:999px;
  font-weight:900;
  padding:11px 24px;
  transition:transform .15s ease;
}
.replay-button{
  background:#fff;
  color:var(--accent);
  border:2px solid var(--accent);
}
.return-button{
  background:var(--accent);
  color:#fff;
  border:2px solid var(--accent);
}
.replay-button:active,.return-button:active{transform:scale(.96)}
.map-stage{
  position:absolute;
  inset:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity .28s ease,transform .28s ease;
}
.map-stage.switching{opacity:0;transform:scale(.965)}
.map-wrap{position:relative;flex:0 0 auto}
.map{width:100%;height:100%;display:block;pointer-events:none}
.drop-zone{
  position:absolute;
  transform:translate(-50%,-50%);
  width:38px;
  height:38px;
  border:2px dashed rgba(58,102,119,.55);
  border-radius:8px;
  background:#ffffff66;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2px;
  transition:.18s;
}
.drop-zone.hot{
  transform:translate(-50%,-50%) scale(1.08);
  border-color:#47a778;
  background:#dcf8e7ed;
}
.drop-zone.close{
  animation:wobble .36s;
  border-color:#e5b44f;
  background:#fff8db;
}
.drop-zone.filled{
  border-color:transparent;
  background:transparent;
  box-shadow:none;
}
.placed{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  text-align:center;
  font-weight:700;
  color:#294d5d;
  font-size:clamp(10px,1.18vw,14px);
  line-height:1.1;
  white-space:nowrap;
}
.placed img{
  width:clamp(26px,3.1vw,38px);
  height:clamp(20px,2.6vw,31px);
  object-fit:contain;
  opacity:.9;
}
.card{
  display:flex;
  align-items:center;
  gap:9px;
  min-height:49px;
  border:2px solid transparent;
  border-radius:16px;
  background:#fff;
  padding:5px 10px;
  box-shadow:0 6px 14px rgba(43,79,95,.10);
  cursor:grab;
  touch-action:none;
  transition:transform .15s ease,opacity .18s ease,box-shadow .15s ease;
}
.card.lifted{opacity:.22}
.card.done{opacity:0;pointer-events:none;transform:scale(.85)}
.card-icon{
  flex:0 0 auto;
  width:42px;
  height:36px;
  display:grid;
  place-items:center;
  border-radius:12px;
}
.card-icon img{width:34px;height:28px;object-fit:contain}
.card-name{
  font-weight:900;
  font-size:clamp(13px,1.6vw,18px);
  line-height:1.15;
  white-space:pre-line;
}
.category-mountain .card-icon{color:#a87916;background:#fff3cf}
.category-plain .card-icon{color:#328554;background:#e5f7e9}
.category-river .card-icon,.category-lake .card-icon{color:#247ba6;background:#e1f4fb}
.drag-ghost{
  position:fixed;
  left:0;
  top:0;
  z-index:1000;
  pointer-events:none;
  width:170px;
  max-width:26vw;
  box-shadow:0 12px 24px rgba(22,57,76,.18);
  will-change:transform;
  /* 位置は transform だけで動かす（.card の transform 遷移を打ち消す）。
     指の上へ持ち上げる動きだけ margin-top で滑らかに */
  transition:margin-top .14s ease;
}
.game-footer{
  min-height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.message{font-weight:800;color:#496b7a;text-align:center}
.next-button{
  display:none;
  border:0;
  border-radius:999px;
  background:var(--accent);
  color:#fff;
  font-weight:900;
  padding:11px 28px;
  box-shadow:0 8px 16px rgba(38,123,99,.20);
  transition:transform .15s ease;
}
.next-button:active{transform:scale(.96)}
.next-button.show{display:block}
@keyframes wobble{
  25%{transform:translate(-50%,-50%) rotate(-2deg)}
  65%{transform:translate(-50%,-50%) rotate(2deg)}
}
@media(max-width:700px){
  .game-header{grid-template-columns:auto 1fr auto}
  .area-title{font-size:clamp(22px,4.6vw,32px)}
  .game{grid-template-columns:minmax(110px,25vw) minmax(0,1fr) minmax(110px,25vw)}
  .card{min-height:46px;padding:4px 7px}
  .card-icon{width:34px}
  .home-copy span{display:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}


/* --- Kanto Pack Categories --- */
.category-bay .card-icon{
  color:#247ba6;
  background:#e1f4fb;
}
.category-peninsula .card-icon{
  color:#8b6c42;
  background:#f5ead9;
}



/* Geo Explorer Chubu pack category addition */
.category-volcano .card-icon{
  color:#a85c32;
  background:#fde8d9;
}


.category-basin .card-icon{
  color:#8b6b46;
  background:#f3eadb;
}


.category-dune .card-icon{
  color:#9a7030;
  background:#fff1c9;
}


.category-cape .card-icon{
  color:#7a6848;
  background:#f3ead8;
}



/* Geo Explorer Kyushu-Okinawa pack category addition */
.category-island .card-icon{
  color:#2f7f91;
  background:#e3f5f7;
}


/* --- v4.2 Layer switch: layered regions --- */
.layer-switch{
  display:none;
  justify-self:center;
  align-items:center;
  gap:4px;
  padding:3px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#ffffffb8;
  box-shadow:0 4px 10px rgba(43,79,95,.08);
}
.layer-switch.show{display:flex}
.layer-button{
  border:0;
  border-radius:999px;
  background:transparent;
  color:#587382;
  font-weight:900;
  padding:6px 15px;
  min-width:72px;
  cursor:pointer;
  transition:background .16s ease,color .16s ease,transform .12s ease;
}
.layer-button.active{
  background:var(--accent);
  color:#fff;
}
.layer-button:active{transform:scale(.97)}


/* --- v4.4 Persistent medals: layered regions ---
   - no completion checkmarks in the layer switch
   - no "地方クリア" header badge
   - nature medal stays on Nature view after completion
   - life medal stays on Life view after completion
   - when both are complete, both views show the gold region medal
*/
.area-center{
  display:grid;
  justify-items:center;
  gap:5px;
}
.layer-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
#lifeLayerButton.active{
  background:#d88435;
  color:#fff;
}

.achievement-medal{
  position:absolute;
  top:-24px;
  right:-28px;
  z-index:8;
  width:116px;
  height:116px;
  border-radius:50%;
  display:grid;
  place-items:center;
  opacity:0;
  transform:scale(.72);
  pointer-events:none;
  transition:opacity .22s ease, transform .32s cubic-bezier(.2,.85,.25,1.18);
}
.achievement-medal.show{
  opacity:1;
  transform:scale(1);
}
.achievement-medal.nature{
  background:linear-gradient(145deg,#e4f6e8,#bfe7c8);
  border:4px solid #65a979;
  box-shadow:0 12px 28px rgba(60,130,83,.22), inset 0 0 0 3px rgba(255,255,255,.65);
  color:#2d7550;
}
.achievement-medal.life{
  background:linear-gradient(145deg,#fff0df,#f4c692);
  border:4px solid #d88435;
  box-shadow:0 12px 28px rgba(185,108,42,.22), inset 0 0 0 3px rgba(255,255,255,.65);
  color:#a25a1f;
}
.achievement-medal.region{
  background:linear-gradient(145deg,#fff6be,#efc84f);
  border:4px solid #c99316;
  box-shadow:0 12px 30px rgba(167,124,15,.28), inset 0 0 0 3px rgba(255,255,255,.70);
  color:#805c0b;
}
.achievement-medal-inner{
  width:86px;
  height:86px;
  border-radius:50%;
  display:grid;
  grid-template-rows:34px auto auto;
  align-content:center;
  justify-items:center;
  text-align:center;
  background:rgba(255,255,255,.38);
}
.achievement-medal-icon{
  width:32px;
  height:32px;
  display:grid;
  place-items:center;
}
.achievement-medal-icon svg{
  width:36px;
  height:36px;
  display:block;
}
@media(max-width:700px){
  .achievement-medal{
    width:96px;
    height:96px;
    top:-18px;
    right:-20px;
  }
  .achievement-medal-inner{
    width:72px;
    height:72px;
    grid-template-rows:28px auto auto;
  }
  .achievement-medal-icon svg{width:30px;height:30px}
    }


/* --- v7.0 Drag Hint Box --- */
.hint-box{
  white-space:pre-line;
  position:absolute;
  top:-47px;
  left:50%;
  z-index:20;
  width:min(66%,740px);
  min-height:80px;
  padding:12px 24px;
  transform:translate(-50%,-8px);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:1px solid rgba(92,126,139,.24);
  border-radius:15px;
  background:#ffffe0;
  box-shadow:0 8px 18px rgba(28,66,86,.10);
  color:#35586a;
  font-size:clamp(14px,1.6vw,19px);
  font-weight:800;
  line-height:1.35;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .14s ease,transform .14s ease,visibility 0s linear .14s;
}
.hint-box.show{
  opacity:1;
  visibility:visible;
  transform:translate(-50%,0);
  transition-delay:0s;
}
@media(max-width:700px){
  .hint-box{
    top:10px;
    width:min(64%,480px);
    min-height:40px;
    padding:7px 12px;
    font-size:clamp(11px,2vw,14px);
  }
}

/* --- v7.1 Celebration: pale map, gathering stars, certificate --- */
.japan-map .region-shape{transition:fill .7s ease}
.japan-map.instant .region-shape{transition:none}
.japan-map.celebrating{pointer-events:none}
.japan-map .region.bloom{animation:region-bloom .62s ease}
@keyframes region-bloom{
  0%{transform:scale(1);filter:none}
  40%{transform:scale(1.06);filter:brightness(1.22) saturate(1.3)}
  100%{transform:scale(1);filter:none}
}

.home-footer{gap:14px}
.cert-button{
  border:2px solid #c99316;
  background:#fff2b8;
  color:#7a5606;
  border-radius:999px;
  font-weight:900;
  padding:8px 18px;
  transition:transform .15s ease;
}
.cert-button[hidden]{display:none}
.home-reset-button{
  border:1px solid var(--line);
  background:#ffffffc7;
  color:#7b93a0;
  border-radius:999px;
  font-weight:800;
  font-size:14px;
  padding:7px 14px;
  transition:transform .15s ease,background .15s ease;
}
.home-reset-button[hidden]{display:none}
.home-reset-button:active{transform:scale(.96);background:#fff}

/* --- v7.3 確認ダイアログ --- */
.ask-overlay{
  position:fixed;
  inset:0;
  z-index:1200;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:rgba(24,54,75,.5);
  -webkit-backdrop-filter:blur(4px);
  backdrop-filter:blur(4px);
  opacity:0;
  transition:opacity .22s ease;
}
.ask-overlay[hidden]{display:none}
.ask-overlay.show{opacity:1}
.ask-box{
  width:min(420px,100%);
  padding:26px 24px 20px;
  background:var(--panel);
  border-radius:18px;
  box-shadow:0 20px 50px rgba(14,36,52,.32);
  text-align:center;
  outline:none;
  transform:translateY(10px) scale(.97);
  transition:transform .26s cubic-bezier(.2,.8,.25,1);
}
.ask-overlay.show .ask-box{transform:none}
.ask-title{
  margin:0 0 10px;
  font-size:21px;
  font-weight:900;
  color:var(--ink);
}
.ask-body{
  margin:0 0 20px;
  font-size:15px;
  line-height:1.8;
  font-weight:700;
  color:#496b7a;
}
.ask-actions{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
}
.ask-cancel,.ask-ok{
  border-radius:999px;
  font-weight:900;
  padding:11px 26px;
  transition:transform .15s ease;
}
.ask-cancel{
  background:#fff;
  color:var(--accent);
  border:2px solid var(--accent);
}
.ask-ok{
  background:#d9773f;
  color:#fff;
  border:2px solid #d9773f;
}
.ask-cancel:active,.ask-ok:active{transform:scale(.96)}
.cert-button:active{transform:scale(.96)}

.confetti{
  position:fixed;
  inset:0;
  z-index:1100;
  pointer-events:none;
  overflow:hidden;
}
.confetti i{
  position:absolute;
  top:-24px;
  left:var(--x);
  width:var(--w);
  height:var(--h);
  background:var(--c);
  border-radius:2px;
  opacity:0;
  animation:confetti-fall var(--dur) cubic-bezier(.3,.55,.45,1) var(--delay) forwards;
}
@keyframes confetti-fall{
  0%{opacity:1;transform:translate3d(0,0,0) rotate(0)}
  85%{opacity:1}
  100%{opacity:0;transform:translate3d(var(--dx),108vh,0) rotate(var(--rot))}
}

.cert-overlay{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
  background:rgba(24,54,75,.5);
  -webkit-backdrop-filter:blur(4px);
  backdrop-filter:blur(4px);
  opacity:0;
  transition:opacity .26s ease;
}
.cert-overlay[hidden]{display:none}
.cert-overlay.show{opacity:1}
.cert-paper{
  position:relative;
  width:min(660px,100%);
  max-height:100%;
  overflow:auto;
  padding:34px 34px 24px;
  background:var(--panel);
  border-radius:18px;
  box-shadow:0 24px 60px rgba(14,36,52,.35);
  text-align:center;
  outline:none;
  transform:translateY(14px) scale(.97);
  transition:transform .32s cubic-bezier(.2,.8,.25,1);
}
.cert-overlay.show .cert-paper{transform:none}
.cert-paper::before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:12px;
  background:var(--band,#c99316);
}
.cert-paper::after{
  content:"";
  position:absolute;
  inset:22px 12px 12px;
  border:2px solid #e5bd43;
  border-radius:10px;
  pointer-events:none;
}
.cert-title{
  margin:8px 0 4px;
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  font-size:clamp(28px,6vw,42px);
  font-weight:800;
  letter-spacing:.14em;
  color:var(--ink);
}
.cert-name-row{
  display:flex;
  align-items:baseline;
  justify-content:center;
  gap:10px;
  margin:14px 0 8px;
}
.cert-name{
  width:min(11em,64vw);
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  font-size:28px;
  font-weight:800;
  line-height:1.4;
  color:var(--ink);
  text-align:center;
  background:transparent;
  border:0;
  border-bottom:3px solid #e5bd43;
  border-radius:0;
  padding:2px 6px;
  outline:none;
  -webkit-appearance:none;
  appearance:none;
  -webkit-user-select:text;
  user-select:text;
}
.cert-name::placeholder{color:#a9bac3;font-weight:700}
.cert-name:focus{border-bottom-color:var(--accent)}
.cert-san{font-size:20px;font-weight:800}
.cert-body{
  margin:10px 0 16px;
  font-size:17px;
  line-height:1.9;
  font-weight:700;
}
.cert-stamps{
  list-style:none;
  margin:0 auto 14px;
  padding:0;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px 8px;
  max-width:520px;
}
.cert-stamps li{display:grid;justify-items:center;gap:8px}
.stamp-dot{
  width:46px;
  height:46px;
  border-radius:50%;
  background:var(--c);
  display:grid;
  place-items:center;
  box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--c);
}
.stamp-dot svg{width:24px;height:24px}
.stamp-dot path{fill:#fff}
.stamp-name{font-size:13px;font-weight:800;color:#496b7a}
.cert-foot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:6px 14px 12px;
  text-align:left;
}
.cert-date{font-weight:800;font-size:16px}
.cert-issuer{font-size:13px;font-weight:800;color:var(--muted)}
.cert-seal{width:64px;height:64px;flex:none}
.seal-outer{fill:#fff2b8;stroke:#c99316;stroke-width:3}
.seal-inner{fill:none;stroke:#e5bd43;stroke-width:2}
.seal-star{fill:#c99316}
.cert-close{
  background:var(--accent);
  color:#fff;
  border:2px solid var(--accent);
  border-radius:999px;
  font-weight:900;
  padding:11px 34px;
  transition:transform .15s ease;
}
.cert-close:active{transform:scale(.96)}
@media(max-width:560px){
  .cert-paper{padding:30px 18px 20px}
  .cert-body{font-size:15px}
}

/* 画面ごとの背景（拡大縮小の遷移で端が見えないよう、少し大きめに敷く） */
.screen::before{
  content:"";
  position:absolute;
  inset:-6%;
  z-index:-1;
  pointer-events:none;
}

/* --- 各地方の画面: 地方の色の淡い版 + 和紙のような質感 --- */
#gameScreen::before{
  background-color:var(--rg-b,#d5ebef);
  background-image:
    var(--tex-grain),
    var(--tex-fiber),
    radial-gradient(90% 70% at 12% 0%,rgba(255,255,255,.62),rgba(255,255,255,0) 66%),
    radial-gradient(80% 62% at 100% 100%,var(--rg-c,#c5e1e8),rgba(255,255,255,0) 72%),
    linear-gradient(165deg,var(--rg-a,#e7f5f7),var(--rg-b,#d5ebef));
  background-size:220px 220px,360px 360px,auto,auto,auto;
  background-repeat:repeat,repeat,no-repeat,no-repeat,no-repeat;
}

/* --- TOP画面: 3つのテーマ（HTMLの data-theme で切り替え） --- */
/* 海図: 淡い海の青に、等高線のような細い線 */
#homeScreen[data-theme="sea"]::before{
  background-color:#bfe2ea;
  background-image:
    var(--tex-grain),
    var(--tex-fiber),
    var(--tex-contour),
    radial-gradient(90% 70% at 14% 0%,rgba(255,255,255,.55),rgba(255,255,255,0) 66%),
    linear-gradient(170deg,#d9eff3 0%,#bfe1e9 55%,#aad4df 100%);
  background-size:220px 220px,360px 360px,cover,auto,auto;
  background-position:0 0,0 0,center,0 0,0 0;
  background-repeat:repeat,repeat,no-repeat,no-repeat,no-repeat;
}
/* 和紙のにじみ: 生成り色の紙に、8地方の色がふちからにじむ */
#homeScreen[data-theme="washi"]::before{
  background-color:#fbf5e8;
  background-image:
    var(--tex-grain),
    var(--tex-fiber),
    radial-gradient(38% 30% at 6% 10%,rgba(154,219,195,.62),rgba(154,219,195,0) 72%),
    radial-gradient(34% 28% at 96% 14%,rgba(255,216,107,.55),rgba(255,216,107,0) 72%),
    radial-gradient(34% 30% at 95% 52%,rgba(118,201,244,.5),rgba(118,201,244,0) 72%),
    radial-gradient(36% 30% at 4% 46%,rgba(156,175,242,.5),rgba(156,175,242,0) 72%),
    radial-gradient(34% 28% at 96% 92%,rgba(244,154,194,.5),rgba(244,154,194,0) 72%),
    radial-gradient(34% 30% at 50% 102%,rgba(183,217,107,.48),rgba(183,217,107,0) 72%),
    radial-gradient(34% 28% at 6% 92%,rgba(255,164,107,.5),rgba(255,164,107,0) 72%),
    radial-gradient(30% 24% at 50% -2%,rgba(184,155,232,.4),rgba(184,155,232,0) 72%);
  background-size:220px 220px,360px 360px,auto,auto,auto,auto,auto,auto,auto,auto;
  background-repeat:repeat,repeat,no-repeat,no-repeat,no-repeat,no-repeat,no-repeat,no-repeat,no-repeat,no-repeat;
}
/* 地図帳: 古い地図帳の紙の色に、経緯線のような細い格子 */
#homeScreen[data-theme="atlas"]::before{
  background-color:#ead9b4;
  background-image:
    var(--tex-grain),
    var(--tex-fiber),
    repeating-linear-gradient(0deg,rgba(122,92,40,.17) 0 1px,rgba(122,92,40,0) 1px 72px),
    repeating-linear-gradient(90deg,rgba(122,92,40,.17) 0 1px,rgba(122,92,40,0) 1px 72px),
    radial-gradient(85% 75% at 50% 45%,rgba(255,250,232,.7),rgba(255,250,232,0) 70%),
    linear-gradient(170deg,#f2e7c9,#e2cfa4);
  background-size:220px 220px,360px 360px,auto,auto,auto,auto;
  background-repeat:repeat,repeat,repeat,repeat,no-repeat,no-repeat;
}

/* --- 画面上部のボタン: 横幅はそのまま、縦を押しやすく --- */
.game-header{min-height:56px}
.home-button,
.reset-button{
  min-height:48px;
  padding:0 12px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.progress{
  min-height:48px;
  padding:0 12px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* 新しい背景の上でも読みやすいよう、TOPの小さな文字とボタンの文字色を少し濃く */
#homeScreen .version,
#homeScreen .home-copy span{color:#557080}
.home-reset-button{color:#5b7685}

/* --- TOP画面の「はじめから」: 地図の右にある余白の中央へ（高さは従来のまま） --- */
.home-footer{position:relative}
.home-reset-button.side{
  position:absolute;
  top:50%;
  transform:translate(-50%,-50%);
}
.home-reset-button.side:active{transform:translate(-50%,-50%) scale(.96)}

</style>
</head>
<body>

<!-- TOP画面の背景テーマ: data-theme を "sea"(海図) / "washi"(和紙のにじみ) / "atlas"(地図帳) から選ぶ -->
<section class="screen active" id="homeScreen" data-theme="washi">
  <header class="home-header">
    <div class="title-wrap">
      <h1>Geo Explorer</h1>
      <span class="version">v7.4</span>
    </div>
    <div class="home-copy">
      <strong>日本を旅しよう</strong>
      <span>地図をタッチして、行きたい地方へ</span>
    </div>
  </header>

  <main class="home-main">
    <div class="japan-panel" aria-label="日本の地方を選ぶ地図">
      <div class="japan-map" id="japanMap" aria-label="地方を選ぶ日本地図">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="250 570 1910 2480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">Geo Explorer 日本地方地図</title>
  <desc id="map-desc">県境を表示せず、北海道から九州までを8つの地方に色分けしたクリック可能な日本地図。沖縄は表示していません。</desc>
  <style>
  .region {
    cursor: pointer;
    outline: none;
    transition: filter 140ms ease, opacity 140ms ease;
  }
  .region:hover,
  .region:focus {
    filter: brightness(1.045) saturate(1.08);
  }
  .region:active {
    opacity: 0.82;
  }
  .region-shape {
    stroke: #fffdf8;
    stroke-width: 1.6;
    stroke-linejoin: round;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }
</style>
  <defs>
    <filter id="outer-outline" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7.5" result="dilated" />
      <feComposite in="dilated" in2="SourceAlpha" operator="out" result="outline" />
      <feFlood flood-color="#f7f3ea" result="outlineColor" />
      <feComposite in="outlineColor" in2="outline" operator="in" result="coloredOutline" />
      <feMerge>
        <feMergeNode in="coloredOutline" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g id="map-regions" filter="url(#outer-outline)">

function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}

async function travelToGame(levelId){
  if(state.transitioning)return;
  const index=LEVELS.findIndex(v=>v.id===levelId);
  if(index<0)return;
  state.transitioning=true;

  homeScreen.classList.add("leaving");

  gameScreen.classList.add("active");

  await wait(260);

  gameScreen.classList.add("leaving");

  gameScreen.classList.remove("active","leaving");
  homeScreen.classList.add("active");

function ensureStarLayer(){
  const svg=document.querySelector("#japanMap svg");
  if(!svg)return null;

  let defs=svg.querySelector("defs");
  if(!defs){
    defs=document.createElementNS("http://www.w3.org/2000/svg","defs");
    svg.insertBefore(defs,svg.firstChild);
  }

  if(!svg.querySelector("#completion-star-gold")){
    const gradient=document.createElementNS("http://www.w3.org/2000/svg","linearGradient");
    gradient.id="completion-star-gold";
    gradient.setAttribute("x1","0%");
    gradient.setAttribute("y1","0%");
    gradient.setAttribute("x2","0%");
    gradient.setAttribute("y2","100%");

    [["0%","#fff27a"],["48%","#ffc928"],["100%","#ee9d00"]].forEach(([offset,color])=>{
      const stop=document.createElementNS("http://www.w3.org/2000/svg","stop");
      stop.setAttribute("offset",offset);
      stop.setAttribute("stop-color",color);
      gradient.appendChild(stop);
    });
    defs.appendChild(gradient);
  }

  if(!svg.querySelector("#completion-star-glow")){
    const glow=document.createElementNS("http://www.w3.org/2000/svg","filter");
    glow.id="completion-star-glow";
    glow.setAttribute("x","-80%");
    glow.setAttribute("y","-80%");
    glow.setAttribute("width","260%");
    glow.setAttribute("height","260%");

    const blur=document.createElementNS("http://www.w3.org/2000/svg","feGaussianBlur");
    blur.setAttribute("stdDeviation","7");
    blur.setAttribute("result","blur");

    const flood=document.createElementNS("http://www.w3.org/2000/svg","feFlood");
    flood.setAttribute("flood-color","#ffd84e");
    flood.setAttribute("flood-opacity",".56");
    flood.setAttribute("result","glowColor");

    const composite=document.createElementNS("http://www.w3.org/2000/svg","feComposite");
    composite.setAttribute("in","glowColor");
    composite.setAttribute("in2","blur");
    composite.setAttribute("operator","in");
    composite.setAttribute("result","softGlow");

    const merge=document.createElementNS("http://www.w3.org/2000/svg","feMerge");
    const glowNode=document.createElementNS("http://www.w3.org/2000/svg","feMergeNode");
    glowNode.setAttribute("in","softGlow");
    const sourceNode=document.createElementNS("http://www.w3.org/2000/svg","feMergeNode");
    sourceNode.setAttribute("in","SourceGraphic");
    merge.append(glowNode,sourceNode);

    glow.append(blur,flood,composite,merge);
    defs.appendChild(glow);
  }

  let layer=svg.querySelector("#completion-stars");
  if(!layer){
    layer=document.createElementNS("http://www.w3.org/2000/svg","g");
    layer.id="completion-stars";
    layer.setAttribute("aria-hidden","true");
    svg.appendChild(layer);
  }
  return layer;
}

const SVG_NS="http://www.w3.org/2000/svg";
const STAR_PATH="M0,-10 L2.9,-3.2 L10,-3.1 L4.3,1.2 L6.2,8 L0,4.1 L-6.2,8 L-4.3,1.2 L-10,-3.1 L-2.9,-3.2 Z";

function createMedal(){
  const badge=document.createElementNS(SVG_NS,"g");
  badge.setAttribute("aria-hidden","true");

  const outer=document.createElementNS(SVG_NS,"circle");
  outer.setAttribute("r","80");
  outer.setAttribute("class","completion-medal");

  const inner=document.createElementNS(SVG_NS,"circle");
  inner.setAttribute("r","68");
  inner.setAttribute("class","completion-medal-inner");

  const star=document.createElementNS(SVG_NS,"path");
  star.setAttribute("class","completion-medal-star");
  star.setAttribute("d",STAR_PATH);
  star.setAttribute("transform","scale(4.2)");

  badge.append(outer,inner,star);
  return badge;

function addCompletionStar(regionId){
  const svg=document.querySelector("#japanMap svg");
  const region=svg?.querySelector(`#${regionId}`);

  const box=region.getBBox();
  const cx=box.x+box.width/2;
  const cy=box.y+box.height/2;

  const badge=createMedal();

  badge.dataset.y=cy;

      state.completed.has(`${level.id}:nature`) &&
      state.completed.has(`${level.id}:life`)

      done.add(level.id);

  });
  return done;

  const completedRegions=getCompletedRegions();

    homeMessage.textContent="日本一周 達成！ ぜんぶの地図が完成したよ";

    homeMessage.textContent=completedRegions.size

function initAudio(){
  if(!state.audio)state.audio=new(window.AudioContext||window.webkitAudioContext)();
  if(state.audio.state==="suspended")state.audio.resume();
}
function tone(f,d=.1,type="sine",g=.035,delay=0){
  initAudio();
  const t=state.audio.currentTime+delay;
  const o=state.audio.createOscillator();
  const a=state.audio.createGain();
  o.type=type;
  o.frequency.setValueAtTime(f,t);
  a.gain.setValueAtTime(g,t);
  a.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(a);
  a.connect(state.audio.destination);
  o.start(t);
  o.stop(t+d);
}
const pickup=()=>{tone(430,.07,"sine",.025);tone(610,.08,"sine",.022,.045)};
const correct=()=>{tone(590,.10);tone(790,.13,"sine",.035,.08)};
const closeSound=()=>{tone(660,.07,"triangle",.025);tone(760,.08,"triangle",.022,.065)};
const clearSound=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,"sine",.04,i*.09));

function fitMap(){
  if(!gameScreen.classList.contains("active"))return;
  const level=currentLevel();
  const rect=mapStage.getBoundingClientRect();
  const ratio=level.mapWidth/level.mapHeight;
  let width=rect.width;
  let height=width/ratio;
  if(height>rect.height){
    height=rect.height;
    width=height*ratio;
  }
  width*=level.displayScale||1;
  height*=level.displayScale||1;
  mapWrap.style.width=`${Math.floor(width)}px`;
  mapWrap.style.height=`${Math.floor(height)}px`;
}

const TEN_ITEM_LAYOUT_TEST = false;

function expandToTenForLayoutTest(sourceItems){

  const leftBase  = items.filter(item => item.side === "left");
  const rightBase = items.filter(item => item.side === "right");

  const L1 = leftBase[0]  || items[0];
  const L2 = leftBase[1]  || items[1] || items[0];
  const R1 = rightBase[0] || items[3] || items[0];
  const R2 = rightBase[1] || items[4] || items[0];

  const clamp = v => Math.max(7, Math.min(93, v));

  return items.concat([
    {
      ...L1,
      id:`${L1.id}-layout-test-7`,
      name:"追加山地",
      side:"left",
      x:clamp(Number(L1.x) + 7),
      y:clamp(Number(L1.y) - 7),
      __layoutTest:true
    },
    {
      ...L2,
      id:`${L2.id}-layout-test-8`,
      name:"追加平野",
      side:"left",
      x:clamp(Number(L2.x) - 7),
      y:clamp(Number(L2.y) + 7),
      __layoutTest:true
    },
    {
      ...R1,
      id:`${R1.id}-layout-test-9`,
      name:"追加河川",
      side:"right",
      x:clamp(Number(R1.x) - 7),
      y:clamp(Number(R1.y) - 7),
      __layoutTest:true
    },
    {
      ...R2,
      id:`${R2.id}-layout-test-10`,
      name:"追加地形",
      side:"right",
      x:clamp(Number(R2.x) + 7),
      y:clamp(Number(R2.y) + 7),
      __layoutTest:true
    }
  ]);
}

function loadLevel(index){
  hideHint();
  achievementMedal.classList.remove("show");
  state.levelIndex=index;
  const level=currentLevel();
  const sourceItems=currentItems();
  state.items=sourceItems.map(item=>({
    ...item,
    icon:item.icon.includes("?")?item.icon:`${item.icon}?v=420`
  }));
  const saved=state.levelProgress.get(currentProgressKey());
  const validIds=new Set(state.items.map(item=>item.id));
  // 保存データにカードの増減があっても壊れないよう、存在するIDだけを復元
  state.placed=new Set(saved ? [...saved].filter(id=>validIds.has(id)) : []);
  if(state.completed.has(currentProgressKey())&&state.placed.size<state.items.length){
    state.completed.delete(currentProgressKey());   // カードが増えていたら未完了に戻す
    saveProgress();
  }
  clearLevelDom();

  areaTitle.textContent=level.name;
  applyRegionTheme(level.id);
  updateLayerSwitch();
  mapImage.src=level.map;
  mapImage.alt=`${level.name}の地図`;
  message.style.display="";
  message.textContent=mapBuildMessage();
  completionActions.classList.remove("show");

  mapStage.classList.add("switching");
  fitMap();
  build();
  restorePlacedItems();

  updateResetButton();
  if(state.placed.size===state.items.length&&state.items.length){
    showCompletedState(false);
  }

  requestAnimationFrame(()=>{
    fitMap();
    mapStage.classList.remove("switching");
  });
}

function build(){
  if(!state.items.length){
    message.textContent="カードを読み込めませんでした。";
    progress.textContent="0 / 0";
    return;
  }

  state.items.forEach(item=>{
    const zone=document.createElement("div");
    zone.className="drop-zone";
    zone.dataset.id=item.id;
    zone.style.left=item.x+"%";
    zone.style.top=item.y+"%";
    zone.setAttribute("aria-label",`${item.name}の配置場所`);
    mapWrap.appendChild(zone);

    const card=document.createElement("div");
    card.className=`card category-${item.category}`;
    card.dataset.id=item.id;
    card.innerHTML=`<span class="card-icon"><img src="${item.icon}" alt=""></span><span class="card-name">${item.name}</span>`;
    card.addEventListener("pointerdown",startDrag);
    if(state.placed.has(item.id))card.classList.add("done");
    (item.side==="left"?leftCards:rightCards).appendChild(card);
  });

  update();
}

function restorePlacedItems(){
  state.items.forEach(item=>{
    if(!state.placed.has(item.id))return;
    const zone=mapWrap.querySelector(`.drop-zone[data-id="${item.id}"]`);
    if(!zone)return;
    zone.classList.add("filled");
    zone.innerHTML=`<div class="placed"><img src="${item.icon}" alt=""><span>${item.name}</span></div>`;
  });
  update();
}

/* =========================================================
   Drag handling (v7.0 fixes)
   - 2本目の指・別ポインターは無視（カードが画面に残る不具合の修正）
   - 置き場所は「一番近いもの」を選ぶ
   - タッチ時はカードを指の少し上に持ち上げ、その位置で判定
   - ゴーストは transform のみで移動、置き場所の位置は開始時に1回だけ測定
   ========================================================= */
const TOUCH_DRAG_OFFSET_Y=64;  // タッチ時にカードを指より上へ持ち上げる量(px)
const ZONE_MARGIN=18;          // 置き場所の周囲で許容する余白(px)

function ghostTransform(x,y){
  return `translate3d(${x}px,${y}px,0) translate(-50%,-50%) scale(1.01)`;
}

function cacheDropZones(){
  const d=state.dragging;
  if(!d)return;
  d.zones=[...mapWrap.querySelectorAll(".drop-zone:not(.filled)")].map(el=>{
    const r=el.getBoundingClientRect();
    return {
      el,
      left:r.left,right:r.right,top:r.top,bottom:r.bottom,
      cx:(r.left+r.right)/2,cy:(r.top+r.bottom)/2
    };
  });
}

function startDrag(e){
  if(state.dragging)return;                          // すでにドラッグ中なら無視
  if(e.pointerType==="mouse"&&e.button!==0)return;   // マウスの右クリック等は無視

  const card=e.currentTarget;
  const item=state.items.find(value=>value.id===card.dataset.id);
  if(!item||state.placed.has(item.id))return;

  e.preventDefault();
  showHint(item);
  pickup();

  const offsetY=e.pointerType==="touch"?TOUCH_DRAG_OFFSET_Y:0;

  const ghost=card.cloneNode(true);
  ghost.classList.add("drag-ghost");
  ghost.style.transform=ghostTransform(e.clientX,e.clientY);
  document.body.appendChild(ghost);
  if(offsetY){
    ghost.offsetWidth;                               // 初期状態を確定させてから持ち上げる
    ghost.style.marginTop=`${-offsetY}px`;
  }

  card.classList.add("lifted");
  state.pointerX=e.clientX;
  state.pointerY=e.clientY;
  state.dragging={item,card,ghost,pointerId:e.pointerId,offsetY,hot:null,zones:[]};
  cacheDropZones();

  window.addEventListener("pointermove",move,{passive:false});
  window.addEventListener("pointerup",end);
  window.addEventListener("pointercancel",onDragCancel);
}

function move(e){
  const d=state.dragging;
  if(!d||e.pointerId!==d.pointerId)return;
  e.preventDefault();
  state.pointerX=e.clientX;
  state.pointerY=e.clientY;

  if(state.raf)return;
  state.raf=requestAnimationFrame(()=>{
    state.raf=0;
    const cur=state.dragging;
    if(!cur)return;

    cur.ghost.style.transform=ghostTransform(state.pointerX,state.pointerY);

    const target=zoneAt(state.pointerX,state.pointerY-cur.offsetY);
    if(target!==cur.hot){
      if(cur.hot)cur.hot.classList.remove("hot");
      if(target)target.classList.add("hot");
      cur.hot=target;
    }
  });
}

// 判定位置(x,y)に最も近い置き場所を返す（開始時に測ったキャッシュを使用）
function zoneAt(x,y){
  const zones=state.dragging&&state.dragging.zones;
  if(!zones)return null;

  let best=null,bestOut=Infinity,bestCenter=Infinity;
  for(const z of zones){
    const dx=Math.max(z.left-x,0,x-z.right);
    const dy=Math.max(z.top-y,0,y-z.bottom);
    if(dx>ZONE_MARGIN||dy>ZONE_MARGIN)continue;

    const out=Math.hypot(dx,dy);                    // 枠の外側までの距離（枠内なら0）
    const center=Math.hypot(x-z.cx,y-z.cy);        // 中心までの距離（同点のときの決め手）
    if(out<bestOut||(out===bestOut&&center<bestCenter)){
      best=z;bestOut=out;bestCenter=center;
    }
  }
  return best?best.el:null;
}

function finishDrag(){
  const d=state.dragging;
  if(!d)return;

  if(d.hot)d.hot.classList.remove("hot");
  d.ghost.remove();
  d.card.classList.remove("lifted");
  state.dragging=null;

  if(state.raf){
    cancelAnimationFrame(state.raf);
    state.raf=0;
  }
  window.removeEventListener("pointermove",move);
  window.removeEventListener("pointerup",end);
  window.removeEventListener("pointercancel",onDragCancel);
}

function end(e){
  const d=state.dragging;
  if(!d||e.pointerId!==d.pointerId)return;

  const {item,card}=d;
  const hit=zoneAt(e.clientX,e.clientY-d.offsetY);
  finishDrag();
  hideHint();

  if(hit&&hit.dataset.id===item.id){
    place(item,card,hit);
  }else if(hit){
    hit.classList.add("close");
    setTimeout(()=>hit.classList.remove("close"),420);
    message.textContent="おしい！";
    closeSound();
  }else{
    message.textContent=mapBuildMessage();
  }
}

function onDragCancel(e){
  if(!state.dragging||e.pointerId!==state.dragging.pointerId)return;
  cancelDrag();
}

function cancelDrag(){
  hideHint();
  finishDrag();
}

function place(item,card,zone){
  state.placed.add(item.id);
  state.levelProgress.set(currentProgressKey(),new Set(state.placed));
  saveProgress();
  updateResetButton();
  zone.classList.add("filled");
  zone.innerHTML=`<div class="placed"><img src="${item.icon}" alt=""><span>${item.name}</span></div>`;
  card.classList.add("done");
  correct();
  message.textContent="ぴったり！";
  update();

  if(state.placed.size===state.items.length)complete();
}

function update(){
  progress.textContent=`${state.placed.size} / ${state.items.length}`;
}

function showCompletedState(playSound=true){
  if(playSound)clearSound();
  const isNewCompletion=!state.completed.has(currentProgressKey());
  state.completed.add(currentProgressKey());
  state.levelProgress.set(
    currentProgressKey(),
    new Set(state.items.map(item=>item.id))
  );
  if(isNewCompletion)saveProgress();
  message.style.display="none";
  completionActions.classList.add("show");
  updateResetButton();
  updateLayerSwitch();
}

function complete(){
  showCompletedState(true);

  if(currentLevel().sets){
    const currentType=state.layer==="nature" ? "nature" : "life";
    achievementMedal.classList.remove("show");
    setTimeout(()=>showAchievementMedal(currentType),80);
  }
}

function replayCurrentLevel(){
  const key=currentProgressKey();
  state.levelProgress.set(key,new Set());
  state.completed.delete(key);
  state.placed=new Set();
  saveProgress();
  updateLayerSwitch();
  loadLevel(state.levelIndex);
}

natureLayerButton.addEventListener("click",()=>switchLayer("nature"));
lifeLayerButton.addEventListener("click",()=>switchLayer("life"));

/* =========================================================
   Progress persistence (localStorage)
   ========================================================= */
const STORAGE_KEY="geoExplorer.progress.v1";

function saveProgress(){
  try{
    const progress={};
    state.levelProgress.forEach((ids,key)=>{progress[key]=[...ids]});
    localStorage.setItem(STORAGE_KEY,JSON.stringify({
      v:1,
      completed:[...state.completed],
      progress,
      name:state.playerName,
      finishedOn:state.finishedOn,
      celebrated:state.celebrated
    }));
  }catch(err){/* 保存できない環境（プライベートブラウズ等）でもゲームは続行 */}
}

function loadProgress(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return;
    const data=JSON.parse(raw);
    if(!data||data.v!==1)return;

    if(Array.isArray(data.completed)){
      data.completed.forEach(key=>{
        if(typeof key==="string")state.completed.add(key);
      });
    }
    if(data.progress&&typeof data.progress==="object"){
      Object.entries(data.progress).forEach(([key,ids])=>{
        if(Array.isArray(ids))state.levelProgress.set(key,new Set(ids));
      });
    }
    if(typeof data.name==="string")state.playerName=data.name.slice(0,12);
    if(typeof data.finishedOn==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(data.finishedOn)){
      state.finishedOn=data.finishedOn;
    }
    state.celebrated=data.celebrated===true;
  }catch(err){/* 壊れたデータは無視して最初から */}
}

/* =========================================================
   Celebration (v7.1): 全地方の完成
   1) 地図は完成するまで淡い色。8地方そろうと北から順にフルカラーへ
   2) 8つの星が地図の中心へ集まり、はじける
   3) 「日本一周 達成証」を表示（なまえを入れられる）
   ========================================================= */
const PALE_UNTIL_COMPLETE=true;   // false にすると、最初から全地方がカラー表示（従来どおり）
const PALE_MIX=.34;               // 未完成の地方の淡さ（白との混ぜ具合。大きいほど淡い）

const japanMap=$("japanMap");
const certButton=$("certButton");
const certOverlay=$("certOverlay");
const certPaper=$("certPaper");
const certName=$("certName");
const certDate=$("certDate");
const certClose=$("certClose");
const certStamps=$("certStamps");
const confettiLayer=$("confetti");
const homeResetButton=$("homeResetButton");
const resetOverlay=$("resetOverlay");
const resetBox=$("resetBox");
const resetAskBody=$("resetAskBody");
const resetCancel=$("resetCancel");
const resetOk=$("resetOk");

const regionColors={};
let celebrating=false;
let celebrationSkip=false;
let celebrationTimer=0;
const skipWaiters=new Set();

function initRegionColors(){
  document.querySelectorAll("#japanMap svg .region").forEach(region=>{
    region.querySelectorAll(".region-shape").forEach(path=>{
      const color=path.getAttribute("fill");
      path.dataset.color=color;
      if(!regionColors[region.id])regionColors[region.id]=color;
    });
  });
}

function paleColor(hex){
  const n=parseInt(hex.slice(1),16);
  const mix=c=>Math.round(c*(1-PALE_MIX)+255*PALE_MIX);
  return `rgb(${mix((n>>16)&255)},${mix((n>>8)&255)},${mix(n&255)})`;
}

function setRegionFill(regionId,full){
  document.querySelectorAll(`#japanMap svg #${regionId} .region-shape`).forEach(path=>{
    const color=path.dataset.color;
    path.style.fill=(full||!PALE_UNTIL_COMPLETE)?color:paleColor(color);
  });
}

// 完成した地方だけをカラーにする（残りは淡い色のまま）。
// instant=true のときは色の変化をアニメーションさせない（読み込み時のチラつき防止）
let mapPainted=false;
function applyMapColors(completedRegions,instant=!mapPainted){
  if(instant)japanMap.classList.add("instant");
  LEVELS.forEach(level=>setRegionFill(level.id,completedRegions.has(level.id)));
  mapPainted=true;
  if(instant){
    requestAnimationFrame(()=>requestAnimationFrame(()=>japanMap.classList.remove("instant")));
  }
}

// 白との混ぜ具合(amount)で淡い色をつくる
function tintColor(hex,amount){
  const n=parseInt(hex.slice(1),16);
  const mix=c=>Math.round(c*(1-amount)+255*amount);
  return `rgb(${mix((n>>16)&255)},${mix((n>>8)&255)},${mix(n&255)})`;
}

// 各地方の画面の背景色（地図の色の淡い版）
function applyRegionTheme(regionId){
  const color=regionColors[regionId];
  if(!color)return;
  gameScreen.style.setProperty("--rg-a",tintColor(color,.86));
  gameScreen.style.setProperty("--rg-b",tintColor(color,.72));
  gameScreen.style.setProperty("--rg-c",tintColor(color,.58));
}

// TOP画面の「はじめから」を、地図の右にある余白の中央に置く（余白が足りない画面では従来どおり下段に並べる）
function placeHomeReset(){
  if(homeResetButton.hidden)return;
  const panel=homeScreen.querySelector(".japan-panel");
  const footer=homeScreen.querySelector(".home-footer");
  if(!panel||!footer)return;

  const screenW=homeScreen.clientWidth;
  const panelRight=panel.offsetLeft+panel.offsetWidth;
  const space=screenW-panelRight;
  const buttonW=homeResetButton.offsetWidth;

  if(space>=buttonW+32){
    homeResetButton.style.left=`${(panelRight+screenW)/2-footer.offsetLeft}px`;
    homeResetButton.classList.add("side");
  }else{
    homeResetButton.style.left="";
    homeResetButton.classList.remove("side");
  }
}

function todayISO(){
  const d=new Date();
  const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

function formatJaDate(iso){
  const [y,m,d]=String(iso).split("-").map(Number);
  return y&&m&&d?`${y}年${m}月${d}日`:"";
}

/* ---------- 証明書 ---------- */
function buildCertificate(){
  const colors=LEVELS.map(level=>regionColors[level.id]||"#c99316");
  const step=100/colors.length;
  certPaper.style.setProperty(
    "--band",
    `linear-gradient(90deg,${colors.map((c,i)=>`${c} ${i*step}% ${(i+1)*step}%`).join(",")})`
  );
  certStamps.innerHTML=LEVELS.map((level,i)=>
    `<li style="--c:${colors[i]}"><span class="stamp-dot"><svg viewBox="-12 -12 24 24" aria-hidden="true"><path d="${STAR_PATH}"/></svg></span><span class="stamp-name">${level.name}</span></li>`
  ).join("");
}

function openCertificate(){
  certName.value=state.playerName;
  certDate.textContent=formatJaDate(state.finishedOn||todayISO());
  certOverlay.hidden=false;
  requestAnimationFrame(()=>{
    certOverlay.classList.add("show");
    certPaper.focus({preventScroll:true});
  });
}

function closeCertificate(){
  certName.blur();
  certOverlay.classList.remove("show");
  setTimeout(()=>{
    if(!certOverlay.classList.contains("show"))certOverlay.hidden=true;
  },280);
}

certButton.addEventListener("click",openCertificate);
certClose.addEventListener("click",closeCertificate);
certName.addEventListener("input",()=>{
  state.playerName=certName.value.trim().slice(0,12);
  saveProgress();
});
certName.addEventListener("keydown",event=>{
  if(event.key==="Enter"){
    event.preventDefault();
    certName.blur();
  }
});
document.addEventListener("keydown",event=>{
  if(event.key==="Escape"&&!certOverlay.hidden)closeCertificate();
});

/* ---------- アニメーションの道具 ---------- */
const reducedMotion=()=>!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
const easeInOutCubic=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOutCubic=t=>1-Math.pow(1-t,3);
const easeOutBack=t=>{
  const c1=1.70158,c3=c1+1;
  return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);
};

// スキップできる待ち時間
function cwait(ms){
  return new Promise(resolve=>{
    if(celebrationSkip){resolve();return}
    const done=()=>{
      clearTimeout(timer);
      skipWaiters.delete(done);
      resolve();
    };
    const timer=setTimeout(done,ms);
    skipWaiters.add(done);
  });
}

// スキップできるアニメーション（fn は 0→1 の値を受け取る）
function ctween(ms,fn,ease=easeInOutCubic){
  return new Promise(resolve=>{
    const t0=performance.now();
    const frame=now=>{
      const t=celebrationSkip?1:Math.min(1,(now-t0)/ms);
      fn(ease(t));
      if(t<1)requestAnimationFrame(frame);
      else resolve();
    };
    requestAnimationFrame(frame);
  });
}

function skipCelebration(){
  if(!celebrating||celebrationSkip)return;
  celebrationSkip=true;
  [...skipWaiters].forEach(fn=>fn());
}
homeScreen.addEventListener("pointerdown",skipCelebration);

const gatherTick=i=>tone(660+i*70,.09,"sine",.022);
const fanfare=()=>{
  [523,659,784,1047].forEach((f,i)=>tone(f,.22,"sine",.04,i*.1));
  [1047,1319,1568].forEach((f,i)=>tone(f,.5,"triangle",.03,.42+i*.06));
};

function spawnConfetti(){
  const palette=[...Object.values(regionColors),"#ffc928"];
  const rand=(a,b)=>a+Math.random()*(b-a);
  const frag=document.createDocumentFragment();
  for(let i=0;i<56;i++){
    const piece=document.createElement("i");
    piece.style.setProperty("--x",`${rand(2,98).toFixed(1)}vw`);
    piece.style.setProperty("--dx",`${rand(-14,14).toFixed(1)}vw`);
    piece.style.setProperty("--w",`${rand(7,12).toFixed(1)}px`);
    piece.style.setProperty("--h",`${rand(11,18).toFixed(1)}px`);
    piece.style.setProperty("--c",palette[i%palette.length]);
    piece.style.setProperty("--rot",`${Math.round(rand(360,1080))}deg`);
    piece.style.setProperty("--dur",`${rand(2,3.2).toFixed(2)}s`);
    piece.style.setProperty("--delay",`${rand(0,.8).toFixed(2)}s`);
    frag.appendChild(piece);
  }
  confettiLayer.replaceChildren(frag);
  setTimeout(()=>confettiLayer.replaceChildren(),4600);
}

/* ---------- 演出: 星が集まる → はじける → 北から順に色づく ---------- */
async function playCelebration(){
  const svg=document.querySelector("#japanMap svg");
  const layer=ensureStarLayer();
  if(!svg||!layer)return;

  const order=LEVELS.map(level=>level.id);
  const badges=[...layer.querySelectorAll("g[data-region]")]
    .sort((a,b)=>order.indexOf(a.dataset.region)-order.indexOf(b.dataset.region));

  const box=svg.querySelector("#map-regions").getBBox();
  const cx=box.x+box.width/2;
  const cy=box.y+box.height/2;

  // 中心の大きな星（集まるほど大きくなる）
  const big=createMedal();
  layer.appendChild(big);
  let bigScale=0;
  let bigTarget=0;
  let bigFollowing=true;
  const drawBig=()=>big.setAttribute("transform",`translate(${cx} ${cy}) scale(${bigScale.toFixed(3)})`);
  drawBig();
  (function follow(){
    if(!bigFollowing)return;
    bigScale+=(bigTarget-bigScale)*.28;
    drawBig();
    requestAnimationFrame(follow);
  })();

  // 1) 8つの星が北から順に中心へ
  const fly=async(badge,i)=>{
    const x0=+badge.dataset.x;
    const y0=+badge.dataset.y;
    await cwait(250+i*110);
    await ctween(820,e=>{
      const x=x0+(cx-x0)*e;
      const y=y0+(cy-y0)*e;
      const sc=1-.35*e;
      badge.setAttribute("transform",`translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${sc.toFixed(3)})`);
    });
    badge.style.visibility="hidden";
    gatherTick(i);
    bigTarget=.9+.17*(i+1);
  };
  await Promise.all(badges.map(fly));

  // 2) はじける
  await cwait(140);
  bigTarget=3.4;
  fanfare();
  spawnConfetti();

  const ring=document.createElementNS(SVG_NS,"circle");
  ring.setAttribute("cx",cx);
  ring.setAttribute("cy",cy);
  ring.setAttribute("fill","none");
  ring.setAttribute("stroke","#ffc928");
  layer.appendChild(ring);
  const ringDone=ctween(900,e=>{
    ring.setAttribute("r",(120+380*e).toFixed(1));
    ring.setAttribute("stroke-width",(18-14*e).toFixed(1));
    ring.setAttribute("opacity",(1-e).toFixed(2));
  },easeOutCubic);

  // 3) 北から順に、地図が light を帯びて弾む（色はすでに完成時に付いている）
  const bloom=Promise.all(order.map(async(id,j)=>{
    await cwait(j*150);
    setRegionFill(id,true);
    const region=svg.querySelector(`#${id}`);
    if(region){
      region.classList.add("bloom");
      setTimeout(()=>region.classList.remove("bloom"),620);
    }
  }));

  // 4) 星がそれぞれの地方へ戻り、中心の星は消える
  await cwait(900);
  bigFollowing=false;
  const back=Promise.all(badges.map(async(badge,i)=>{
    await cwait(i*60);
    const x=+badge.dataset.x;
    const y=+badge.dataset.y;
    badge.style.visibility="visible";
    await ctween(420,e=>{
      badge.setAttribute("transform",`translate(${x} ${y}) scale(${Math.max(e,0).toFixed(3)})`);
    },easeOutBack);
  }));
  const fade=ctween(500,e=>big.setAttribute("opacity",(1-e).toFixed(2)),easeOutCubic);

  await Promise.all([back,fade,bloom,ringDone]);
  await cwait(400);
  big.remove();
  ring.remove();
}

async function runCelebration(){
  if(celebrating||state.celebrated)return;
  celebrating=true;
  celebrationSkip=false;
  japanMap.classList.add("celebrating");
  try{
    if(reducedMotion()){
      applyMapColors(getCompletedRegions(),true);
    }else{
      await playCelebration();
    }
  }catch(err){
    console.error(err);
  }finally{
    state.celebrated=true;
    saveProgress();
    japanMap.classList.remove("celebrating");
    celebrating=false;
    celebrationSkip=false;
    skipWaiters.clear();
    updateHome();        // 星と色を最終状態に整える
    openCertificate();
  }
}

/* ---------- v7.3: TOP画面の「はじめから」（ぜんぶ消す） ---------- */
function startedCount(){
  let n=0;
  state.levelProgress.forEach(ids=>{if(ids.size)n++});
  return n;
}

function openResetAsk(){
  const regions=getCompletedRegions().size;
  const parts=[];
  if(regions)parts.push(`完成した${regions}つの地方`);
  if(state.playerName)parts.push("証明書のなまえ");
  resetAskBody.textContent=parts.length
    ? `${parts.join("と")}をふくめて、ぜんぶの記録が消えます。もとに戻せません。`
    : "これまでの記録がぜんぶ消えます。もとに戻せません。";
  resetOverlay.hidden=false;
  requestAnimationFrame(()=>{
    resetOverlay.classList.add("show");
    resetCancel.focus({preventScroll:true});   // 既定は「やめる」側
  });
}

function closeResetAsk(){
  resetOverlay.classList.remove("show");
  setTimeout(()=>{
    if(!resetOverlay.classList.contains("show"))resetOverlay.hidden=true;
  },240);
}

function resetEverything(){
  state.levelProgress.clear();
  state.completed.clear();
  state.placed=new Set();
  state.playerName="";
  state.finishedOn="";
  state.celebrated=false;
  mapPainted=false;          // 色を一気に戻す（アニメーションさせない）
  try{localStorage.removeItem(STORAGE_KEY)}catch(err){/* 保存できない環境でも続行 */}
  certName.value="";
  updateHome();
}

homeResetButton.addEventListener("click",openResetAsk);
resetCancel.addEventListener("click",closeResetAsk);
resetOk.addEventListener("click",()=>{
  closeResetAsk();
  resetEverything();
});
resetOverlay.addEventListener("click",event=>{
  if(event.target===resetOverlay)closeResetAsk();   // 外側をタップしたら中止
});
document.addEventListener("keydown",event=>{
  if(event.key==="Escape"&&!resetOverlay.hidden)closeResetAsk();
});

function queueCelebration(delay=700){
  clearTimeout(celebrationTimer);
  celebrationTimer=setTimeout(()=>{
    if(celebrating||state.celebrated)return;
    if(!homeScreen.classList.contains("active"))return;   // 戻ってきたときに updateHome が再度呼ぶ
    if(state.transitioning){queueCelebration(300);return}
    runCelebration();
  },delay);
}

initRegionColors();
buildCertificate();

function onLayoutChange(){
  fitMap();
  cacheDropZones();   // ドラッグ中に画面サイズが変わったら置き場所を測り直す
  placeHomeReset();
}

window.addEventListener("resize",onLayoutChange);
if("ResizeObserver"in window){
  new ResizeObserver(onLayoutChange).observe(mapStage);
  new ResizeObserver(placeHomeReset).observe(homeScreen);
}
window.addEventListener("load",placeHomeReset);
loadProgress();
updateHome();
</script>
