      <ns0:feComposite in="dilated" in2="SourceAlpha" operator="out" result="outline"/>
      <ns0:feFlood flood-color="#B9AE92" flood-opacity="1" result="outlineColor"/>
      <ns0:feComposite in="outlineColor" in2="outline" operator="in" result="coloredOutline"/>
      <ns0:feMerge>
        <ns0:feMergeNode in="coloredOutline"/>
        <ns0:feMergeNode in="SourceGraphic"/>
      </ns0:feMerge>
    </ns0:filter>
