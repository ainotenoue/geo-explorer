  <ns0:title id="title">九州・沖縄地方 Level4.5.1</ns0:title>
  <ns0:desc id="desc">九州本島を主役に配置し、対馬・五島列島・屋久島・種子島を整理。沖縄は右下の独立インセットで示すGeo Explorer正式版。</ns0:desc>
