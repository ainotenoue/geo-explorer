  .land { fill:#F2E8CF; }
  .prefecture-boundary { fill:#F2E8CF; stroke:#B9AE92; stroke-width:0.72; stroke-opacity:0.34; stroke-linejoin:round; stroke-linecap:round; vector-effect:non-scaling-stroke; }
  .inset-frame { fill:#fffdf8; stroke:#d7e4e6; stroke-width:0.55; stroke-opacity:0.38; vector-effect:non-scaling-stroke; }
</ns0:style>
